name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK (sideload-ready, test on your phone)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB (unsigned, for Play Console upload)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-drills-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB (needs signing before Play Store upload)
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-drills-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
