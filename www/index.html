<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Blueprint Drills</title>
<style>
  @font-face{ font-family:'Baloo 2'; font-style:normal; font-weight:600; font-display:swap; src:url('fonts/baloo-2-latin-600-normal.woff2') format('woff2'); }
  @font-face{ font-family:'Baloo 2'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/baloo-2-latin-700-normal.woff2') format('woff2'); }
  @font-face{ font-family:'Baloo 2'; font-style:normal; font-weight:800; font-display:swap; src:url('fonts/baloo-2-latin-800-normal.woff2') format('woff2'); }
  @font-face{ font-family:'Plus Jakarta Sans'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/plus-jakarta-sans-latin-400-normal.woff2') format('woff2'); }
  @font-face{ font-family:'Plus Jakarta Sans'; font-style:normal; font-weight:500; font-display:swap; src:url('fonts/plus-jakarta-sans-latin-500-normal.woff2') format('woff2'); }
  @font-face{ font-family:'Plus Jakarta Sans'; font-style:normal; font-weight:600; font-display:swap; src:url('fonts/plus-jakarta-sans-latin-600-normal.woff2') format('woff2'); }
  @font-face{ font-family:'Plus Jakarta Sans'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/plus-jakarta-sans-latin-700-normal.woff2') format('woff2'); }
  @font-face{ font-family:'Space Mono'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/space-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face{ font-family:'Space Mono'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/space-mono-latin-700-normal.woff2') format('woff2'); }
</style>
<style>
  :root{
    --bg-base:#FBF7FF;
    --blob1:#F6D9FF;
    --blob2:#D6ECFF;
    --blob3:#FFEAD6;
    --paper:#F6F0FF;
    --card:#FFFFFF;
    --ink:#1E1033;
    --ink-dim:#79709C;
    --line:#E8DEFB;
    --line-strong:#D2BFF5;
    --accent:#8B5CF6;
    --accent2:#EC4899;
    --accent-ink:#6B21D6;
    --accent-tint:#F1E6FF;
    --good:#0FA968;
    --good-tint:#DEFBEA;
    --bad:#F43F5E;
    --bad-tint:#FFE4E8;
    --shadow: 0 2px 6px rgba(139,79,246,0.10), 0 16px 32px -14px rgba(139,79,246,0.38);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-base:#140B26;
      --blob1:#3A1653;
      --blob2:#0F2A46;
      --blob3:#3A1830;
      --paper:#1B1236;
      --card:#20153C;
      --ink:#F4EEFF;
      --ink-dim:#B0A2D9;
      --line:#3A2A5C;
      --line-strong:#513E7E;
      --accent:#B794FF;
      --accent2:#FF7AC6;
      --accent-ink:#E7D6FF;
      --accent-tint:#2C1B4D;
      --good:#39E68F;
      --good-tint:#103A26;
      --bad:#FF6B85;
      --bad-tint:#401822;
      --shadow: 0 2px 6px rgba(0,0,0,0.4), 0 18px 36px -16px rgba(183,148,255,0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg-base:#140B26;
    --blob1:#3A1653;
    --blob2:#0F2A46;
    --blob3:#3A1830;
    --paper:#1B1236;
    --card:#20153C;
    --ink:#F4EEFF;
    --ink-dim:#B0A2D9;
    --line:#3A2A5C;
    --line-strong:#513E7E;
    --accent:#B794FF;
    --accent2:#FF7AC6;
    --accent-ink:#E7D6FF;
    --accent-tint:#2C1B4D;
    --good:#39E68F;
    --good-tint:#103A26;
    --bad:#FF6B85;
    --bad-tint:#401822;
    --shadow: 0 2px 6px rgba(0,0,0,0.4), 0 18px 36px -16px rgba(183,148,255,0.45);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background-color:var(--bg-base);
    background-image:
      radial-gradient(38% 26% at 8% 4%, var(--blob1) 0%, transparent 100%),
      radial-gradient(34% 24% at 96% 14%, var(--blob2) 0%, transparent 100%),
      radial-gradient(40% 30% at 90% 96%, var(--blob3) 0%, transparent 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    padding-inline: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .mono{ font-family:'Space Mono', ui-monospace, monospace; }

  @media (prefers-reduced-motion: no-preference){
    @keyframes pop-in{
      from{ opacity:0; transform:translateY(6px) scale(0.985); }
      to{ opacity:1; transform:translateY(0) scale(1); }
    }
    .card{ animation: pop-in .22s ease; }
  }

  header{
    padding-block: 12px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .brand-mark{
    width:32px;height:32px;
    flex-shrink:0;
    border-radius:10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex;align-items:center;justify-content:center;
    box-shadow: var(--shadow);
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand h1{
    font-family:'Baloo 2', 'Plus Jakarta Sans', sans-serif;
    font-size:19px;
    margin:0;
    font-weight:700;
    letter-spacing:-0.01em;
    background: linear-gradient(100deg, var(--accent) 10%, var(--accent2) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stat-pill{
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    font-variant-numeric: tabular-nums;
    color:var(--accent-ink);
    background:var(--accent-tint);
    border:1.5px solid var(--accent);
    border-radius:999px;
    padding:6px 12px;
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
  }
  .stat-pill b{ color:var(--accent-ink); font-weight:700; }
  .icon-btn{
    width:36px;height:36px;
    border-radius:11px;
    border:none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:var(--shadow);
    flex-shrink:0;
  }
  .icon-btn svg{ width:17px; height:17px; }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  }

  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:20px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
    max-height:100%;
    overflow-y:auto;
  }

  .theme-tag{
    align-self:flex-start;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    border-radius:999px;
    padding:5px 11px;
    border:1.5px solid transparent;
  }
  .tag-c0{ background:#F1E4FF; color:#6B21D6; border-color:#D7B8FF; }
  .tag-c1{ background:#FFE1F0; color:#D6237A; border-color:#FFB8DA; }
  .tag-c2{ background:#FFE8D1; color:#C4600A; border-color:#FFCB99; }
  .tag-c3{ background:#FFF6C2; color:#8A6D00; border-color:#F2E27A; }
  .tag-c4{ background:#D8FBE9; color:#0E8F55; border-color:#9EEFC6; }
  .tag-c5{ background:#DCF1FF; color:#0B76B7; border-color:#A6DFFF; }
  .tag-c6{ background:#E4E4FF; color:#4B3FC9; border-color:#C3C1FF; }
  .tag-c7{ background:#FFE2DE; color:#D8452F; border-color:#FFB9AF; }
  .tag-c8{ background:#D4FBF3; color:#0E8F7E; border-color:#9BEFDF; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tag-c0{ background:#2C1B4D; color:#D6BBFF; border-color:#4A3378; }
    :root:not([data-theme="light"]) .tag-c1{ background:#3A1330; color:#FF9FD1; border-color:#5C2049; }
    :root:not([data-theme="light"]) .tag-c2{ background:#3A2210; color:#FFC088; border-color:#5C3A18; }
    :root:not([data-theme="light"]) .tag-c3{ background:#332C08; color:#F4E24D; border-color:#524711; }
    :root:not([data-theme="light"]) .tag-c4{ background:#0E2A1E; color:#6FF3AE; border-color:#1B4433; }
    :root:not([data-theme="light"]) .tag-c5{ background:#0C2636; color:#8FDBFF; border-color:#173F54; }
    :root:not([data-theme="light"]) .tag-c6{ background:#211F45; color:#B3ACFF; border-color:#37326E; }
    :root:not([data-theme="light"]) .tag-c7{ background:#3A1712; color:#FFA48F; border-color:#5C271E; }
    :root:not([data-theme="light"]) .tag-c8{ background:#0C2C27; color:#6FF3DD; border-color:#194840; }
  }
  :root[data-theme="dark"] .tag-c0{ background:#2C1B4D; color:#D6BBFF; border-color:#4A3378; }
  :root[data-theme="dark"] .tag-c1{ background:#3A1330; color:#FF9FD1; border-color:#5C2049; }
  :root[data-theme="dark"] .tag-c2{ background:#3A2210; color:#FFC088; border-color:#5C3A18; }
  :root[data-theme="dark"] .tag-c3{ background:#332C08; color:#F4E24D; border-color:#524711; }
  :root[data-theme="dark"] .tag-c4{ background:#0E2A1E; color:#6FF3AE; border-color:#1B4433; }
  :root[data-theme="dark"] .tag-c5{ background:#0C2636; color:#8FDBFF; border-color:#173F54; }
  :root[data-theme="dark"] .tag-c6{ background:#211F45; color:#B3ACFF; border-color:#37326E; }
  :root[data-theme="dark"] .tag-c7{ background:#3A1712; color:#FFA48F; border-color:#5C271E; }
  :root[data-theme="dark"] .tag-c8{ background:#0C2C27; color:#6FF3DD; border-color:#194840; }

  .q-index{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.04em;
  }

  .q-text{
    font-family:'Baloo 2', 'Plus Jakarta Sans', sans-serif;
    font-size:19px;
    line-height:1.38;
    font-weight:700;
    letter-spacing:-0.005em;
    text-wrap:balance;
    margin:0;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:9px;
  }

  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    width:100%;
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:16px;
    padding:11px 13px;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size:14.5px;
    font-weight:500;
    line-height:1.4;
    color:var(--ink);
    cursor:pointer;
    transition: border-color .12s ease, background-color .12s ease, transform .08s ease;
  }
  .opt:active{ transform: scale(0.98); }
  .opt:not(:disabled):hover{ border-color: var(--accent); }

  .opt-letter{
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    color:#fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius:50%;
    min-width:26px;
    width:26px;
    height:26px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .opt-text{ flex:1; }
  .opt-icon{
    width:19px;height:19px;
    flex-shrink:0;
    opacity:0;
  }
  .opt-icon svg{ width:100%; height:100%; display:block; }

  .opt.correct{
    background:var(--good-tint);
    border-color:var(--good);
  }
  .opt.correct .opt-letter{ background:var(--good); }
  .opt.correct .opt-icon{ opacity:1; color:var(--good); }

  .opt.wrong{
    background:var(--bad-tint);
    border-color:var(--bad);
  }
  .opt.wrong .opt-letter{ background:var(--bad); }
  .opt.wrong .opt-icon{ opacity:1; color:var(--bad); }

  .opt:disabled{ cursor:default; }
  .opt:disabled:not(.correct):not(.wrong){ opacity:0.5; }

  .explain{
    display:none;
    border-top:2px dashed var(--line-strong);
    padding-top:13px;
    gap:6px;
    flex-direction:column;
  }
  .explain.show{ display:flex; }
  .explain-label{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .explain-body{
    font-size:14px;
    line-height:1.5;
    color:var(--ink);
    margin:0;
  }
  .verdict{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Baloo 2', 'Plus Jakarta Sans', sans-serif;
    font-weight:700;
    font-size:15px;
    margin:0 0 2px;
  }
  .verdict.good{ color:var(--good); }
  .verdict.bad{ color:var(--bad); }
  .verdict svg{ width:17px;height:17px; }

  .next-wrap{
    padding-block: 12px max(12px, env(safe-area-inset-bottom, 0px));
    flex-shrink:0;
    margin-top:auto;
  }
  .next-btn{
    display:none;
    width:100%;
    padding:15px;
    border-radius:999px;
    border:none;
    background: linear-gradient(100deg, var(--accent) 10%, var(--accent2) 100%);
    color:#fff;
    font-family:'Baloo 2', 'Plus Jakarta Sans', sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .next-btn.show{ display:block; }
  .next-btn:active{ transform: scale(0.98); }

  /* Stats drawer */
  .backdrop{
    position:fixed; inset:0;
    background:rgba(20,11,38,0.5);
    display:none;
    z-index:10;
  }
  .backdrop.show{ display:block; }
  .drawer{
    position:fixed;
    left:0;right:0;bottom:0;
    max-height:82vh;
    background:var(--paper);
    border-top:1.5px solid var(--line);
    border-radius:26px 26px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,0.25);
    transform:translateY(100%);
    transition:transform .22s ease;
    z-index:11;
    display:flex;
    flex-direction:column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .drawer.show{ transform:translateY(0); }
  .drawer-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 18px 8px;
    flex-shrink:0;
  }
  .drawer-head h2{
    font-family:'Baloo 2', 'Plus Jakarta Sans', sans-serif;
    font-size:18px; margin:0; font-weight:700;
  }
  .drawer-body{
    overflow-y:auto;
    padding:4px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .theme-row{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:12px 13px;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:14px;
  }
  .theme-row-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .theme-name{ font-size:13.5px; font-weight:700; }
  .theme-frac{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink-dim);
    flex-shrink:0;
  }
  .bar-track{
    height:7px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius:999px;
  }
  .overall-row{
    padding:14px 15px;
    background: linear-gradient(100deg, var(--accent-tint) 0%, var(--accent-tint) 100%);
    border:1.5px solid var(--accent);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .overall-row .theme-name{ color:var(--accent-ink); font-family:'Baloo 2', sans-serif; }
  .overall-row .theme-frac{ color:var(--accent-ink); font-weight:700; }

  .reset-zone{
    margin-top:6px;
    padding-top:14px;
    border-top:2px dashed var(--line-strong);
  }
  .reset-btn{
    width:100%;
    padding:12px;
    border-radius:999px;
    border:2px solid var(--bad);
    background:transparent;
    color:var(--bad);
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }
  .reset-btn.armed{
    background:var(--bad);
    color:#fff;
  }
  .reset-hint{
    font-size:11.5px;
    color:var(--ink-dim);
    text-align:center;
    margin-top:6px;
  }

  @media (min-width: 560px){
    body{ align-items:center; }
    header, main{ width:100%; max-width:520px; }
  }
</style>

<header>
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.5L14.4 9.1L21.5 9.6L15.9 14.1L17.8 21L12 17L6.2 21L8.1 14.1L2.5 9.6L9.6 9.1L12 2.5Z" fill="#fff"/>
      </svg>
    </span>
    <h1>Blueprint Drills</h1>
  </div>
  <div style="display:flex; align-items:center; gap:8px;">
    <button class="stat-pill" id="headerStat" type="button" aria-label="Open score breakdown">
      <b id="hsCorrect">0</b>&nbsp;/&nbsp;<span id="hsTotal">0</span>
    </button>
    <button class="icon-btn" id="openDrawer" type="button" aria-label="Open score breakdown">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 19V11M12 19V5M19 19V14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="card" id="card">
    <span class="theme-tag" id="themeTag">Theme</span>
    <div class="q-index mono" id="qIndex"></div>
    <p class="q-text" id="qText">Loading question…</p>
    <div class="options" id="options"></div>
    <div class="explain" id="explain">
      <p class="verdict" id="verdict"></p>
      <span class="explain-label">Why</span>
      <p class="explain-body" id="explainBody"></p>
    </div>
  </div>
  <div class="next-wrap">
    <button class="next-btn" id="nextBtn" type="button">Next question</button>
  </div>
</main>

<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>Your progress</h2>
    <button class="icon-btn" id="closeDrawer" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody">
    <div class="overall-row">
      <span class="theme-name">Overall accuracy</span>
      <span class="theme-frac mono" id="overallFrac">0 / 0</span>
    </div>
    <div id="themeList"></div>
    <div class="reset-zone">
      <button class="reset-btn" id="resetBtn" type="button">Reset all progress</button>
      <p class="reset-hint">Score is stored on this device only. Tap twice to confirm.</p>
    </div>
  </div>
</div>

<script id="qdata" type="application/json">[{"id":0,"theme":"Pre-Design Planning and Practice Management","question":"What is the purpose of conducting a feasibility study in architectural design?","options":{"A":"To determine the cost and budget of a project","B":"To finalize the building's interior color scheme","C":"To select the construction contractor","D":"To design the landscaping plan"},"correct":"A","explanation":"A feasibility study assesses financial, technical, and environmental aspects of a project before design work proceeds, helping determine whether it is viable."},{"id":1,"theme":"Pre-Design Planning and Practice Management","question":"What is the purpose of conducting a building code analysis during the design phase?","options":{"A":"To ensure compliance with local regulations and standards","B":"To determine the final construction cost","C":"To select interior furnishings","D":"To calculate the architect's fee"},"correct":"A","explanation":"A building code analysis helps architects design structures that meet legal and safety requirements from the outset of the design phase."},{"id":2,"theme":"Pre-Design Planning and Practice Management","question":"What is the purpose of a building permit in architectural design?","options":{"A":"To ensure that a project meets all relevant building codes and regulations","B":"To secure financing for the project","C":"To advertise the project to potential tenants","D":"To register the architect with a professional body"},"correct":"A","explanation":"A building permit verifies that a proposed project complies with safety and regulatory standards before construction begins."},{"id":3,"theme":"Pre-Design Planning and Practice Management","question":"What is the purpose of the pre-design phase in architectural design?","options":{"A":"To gather information and analyze the client's needs and goals","B":"To produce final construction drawings","C":"To select furniture and fittings","D":"To supervise on-site construction work"},"correct":"A","explanation":"The pre-design phase sets the foundation for the entire project by clarifying the client's needs, goals, and constraints before design begins."},{"id":4,"theme":"Pre-Design Planning and Practice Management","question":"What are the key components of a pre-design analysis?","options":{"A":"Site analysis, programming, and feasibility study","B":"Interior decoration, furniture selection, and color schemes","C":"Final construction drawings and specifications","D":"Contractor bidding and procurement"},"correct":"A","explanation":"These steps help architects understand a project's constraints and opportunities before design work begins."},{"id":5,"theme":"Pre-Design Planning and Practice Management","question":"What is the purpose of the programming phase in architectural design?","options":{"A":"To define the functional requirements and spatial needs of a project","B":"To finalize construction contracts","C":"To select building materials for the facade","D":"To conduct a structural safety inspection"},"correct":"A","explanation":"The programming phase ensures the design will meet the intended use and spatial needs of the building."},{"id":6,"theme":"Pre-Design Planning and Practice Management","question":"What is the role of an architect in conducting a site analysis during the pre-design phase?","options":{"A":"To evaluate the existing infrastructure and utilities on a site","B":"To negotiate the architect's professional fee","C":"To draft the final building permit application","D":"To select the project's interior designer"},"correct":"A","explanation":"Evaluating existing infrastructure and utilities ensures that the site can adequately support the proposed development."},{"id":7,"theme":"Pre-Design Planning and Practice Management","question":"What is the significance of conducting a market analysis during the pre-design phase?","options":{"A":"To evaluate market demand and potential profitability of a project","B":"To determine the structural loads on a building","C":"To select the color palette for interiors","D":"To calculate energy consumption"},"correct":"A","explanation":"Understanding market trends helps clients and architects create economically viable designs."},{"id":8,"theme":"Pre-Design Planning and Practice Management","question":"What is the role of an architect in conducting a site visit during the pre-design phase?","options":{"A":"Assessing the existing conditions and constraints of a site","B":"Finalizing the interior furniture layout","C":"Issuing the certificate of practical completion","D":"Negotiating the construction contract price"},"correct":"A","explanation":"A site visit helps the architect determine the best placement and design approach for the building based on real, on-the-ground conditions."},{"id":9,"theme":"Pre-Design Planning and Practice Management","question":"What is the role of an architect in conducting a risk assessment during the pre-design phase?","options":{"A":"Identifying potential risks and challenges that may impact the project","B":"Selecting the final paint colors for the building","C":"Preparing the client's tax documentation","D":"Choosing furniture vendors"},"correct":"A","explanation":"Architects assess environmental, financial, and construction risks early so they can be planned for or mitigated."},{"id":10,"theme":"Pre-Design Planning and Practice Management","question":"What is the role of an architect in conducting a community engagement process during the pre-design phase?","options":{"A":"Incorporating community input and feedback into the design process","B":"Setting the architect's licensing exam schedule","C":"Determining the contractor's profit margin","D":"Issuing building completion certificates"},"correct":"A","explanation":"Community engagement ensures that a project meets local needs and expectations before design work proceeds."},{"id":11,"theme":"Pre-Design Planning and Practice Management","question":"What is the purpose of a design brief in the pre-design phase?","options":{"A":"To define the project goals, objectives, and constraints","B":"To list the final bill of quantities","C":"To record the minutes of a disciplinary tribunal hearing","D":"To specify the paint finish of the facade"},"correct":"A","explanation":"A design brief serves as a roadmap for the entire architectural development process, guiding decisions from concept through completion."},{"id":12,"theme":"Pre-Design Planning and Practice Management","question":"Which stage of professional architectural services typically involves site analysis, feasibility study, and programming?","options":{"A":"Pre-Design Phase","B":"Conceptual Design Phase","C":"Design Development Phase","D":"Construction Documentation"},"correct":"A","explanation":"The Pre-Design Phase focuses on gathering and analyzing information -- including site analysis, feasibility, and programming -- before design concepts are developed."},{"id":13,"theme":"Pre-Design Planning and Practice Management","question":"What does 'office practice' refer to in architecture?","options":{"A":"The administrative, legal, and financial aspects of running an architectural firm","B":"The physical layout of an architect's design studio","C":"The software used for producing construction drawings","D":"The mandatory apprenticeship period before licensure"},"correct":"A","explanation":"Office practice covers the administrative, legal, and financial aspects of running an architectural firm, including contracts, documentation, and client relations."},{"id":14,"theme":"Project Delivery and Contract Administration","question":"What is the role of an architect in the construction administration phase?","options":{"A":"Overseeing the construction process on-site","B":"Preparing the initial feasibility study","C":"Conducting the client's market research","D":"Selling the finished building to tenants"},"correct":"A","explanation":"During construction administration, architects ensure that construction follows the approved design, specifications, and regulatory requirements."},{"id":15,"theme":"Project Delivery and Contract Administration","question":"What is the purpose of a project schedule developed during project planning?","options":{"A":"To determine the optimal sequence of construction activities","B":"To calculate the architect's professional fee","C":"To define the building's structural load capacity","D":"To select interior finishes"},"correct":"A","explanation":"A project schedule outlines when and how key project tasks will be completed, keeping the project on track."},{"id":16,"theme":"Project Delivery and Contract Administration","question":"What is the purpose of a project management plan in architectural projects?","options":{"A":"To outline the project scope","B":"To define team roles and responsibilities","C":"To establish a project timeline","D":"All of the above"},"correct":"D","explanation":"A project management plan brings together scope, roles and responsibilities, and the project timeline into a single guiding document for the project."},{"id":17,"theme":"Project Delivery and Contract Administration","question":"What is the purpose of a project charter in architectural projects?","options":{"A":"It formally authorizes the project","B":"It defines the project's objectives","C":"It identifies key stakeholders","D":"All of the above"},"correct":"D","explanation":"A project charter formally authorizes the project while defining its objectives and identifying the stakeholders involved."},{"id":18,"theme":"Project Delivery and Contract Administration","question":"What is the role of risk management in architectural projects?","options":{"A":"Identifying uncertainties that could affect the project","B":"Developing strategies to mitigate identified risks","C":"Reducing the likelihood of cost and schedule overruns","D":"All of the above"},"correct":"D","explanation":"Risk management helps identify uncertainties and develop mitigation strategies, reducing the chance of cost and schedule overruns."},{"id":19,"theme":"Project Delivery and Contract Administration","question":"What is the purpose of a change management process in architectural projects?","options":{"A":"To ensure project scope adjustments are documented","B":"To ensure changes are properly approved before implementation","C":"To ensure changes are clearly communicated to the project team","D":"All of the above"},"correct":"D","explanation":"A change management process ensures scope adjustments are controlled, approved, and communicated properly."},{"id":20,"theme":"Project Delivery and Contract Administration","question":"What is the purpose of a procurement management plan in architectural projects?","options":{"A":"It defines procurement processes","B":"It establishes supplier and contractor selection criteria","C":"It governs material acquisition","D":"All of the above"},"correct":"D","explanation":"A procurement management plan defines procurement processes, selection criteria, and how materials will be acquired for the project."},{"id":21,"theme":"Project Delivery and Contract Administration","question":"What is the role of quality management in architectural projects?","options":{"A":"Maintaining high construction standards","B":"Helping identify and resolve construction defects","C":"Ensuring work complies with specifications","D":"All of the above"},"correct":"D","explanation":"Quality management maintains construction standards, resolves defects, and ensures compliance with project specifications."},{"id":22,"theme":"Project Delivery and Contract Administration","question":"What is the purpose of a lessons-learned process in architectural projects?","options":{"A":"To capture insights from a completed project","B":"To identify what worked well and what did not","C":"To improve the outcomes of future projects","D":"All of the above"},"correct":"D","explanation":"A lessons-learned process captures insights from past experience to improve the performance of future projects."},{"id":23,"theme":"Project Delivery and Contract Administration","question":"What is the purpose of a project closure process in architectural projects?","options":{"A":"It includes final project reviews","B":"It involves archiving project documents","C":"It formalizes handover to the client","D":"All of the above"},"correct":"D","explanation":"Closing a project includes final reviews, document archiving, and a formal handover to the client."},{"id":24,"theme":"Project Delivery and Contract Administration","question":"What is tendering in architecture?","options":{"A":"The process of soliciting bids from contractors for a construction project","B":"The process of registering an architect with ARCON","C":"The process of applying for a building permit","D":"The process of certifying a building as complete"},"correct":"A","explanation":"Tendering is the process of soliciting bids from contractors, ensuring fair competition and the selection of qualified professionals."},{"id":25,"theme":"Project Delivery and Contract Administration","question":"Which type of tendering involves public bidding open to all qualified contractors?","options":{"A":"Open Tendering","B":"Selective Tendering","C":"Negotiated Tendering","D":"Serial Tendering"},"correct":"A","explanation":"Open tendering is a public bidding process available to any qualified contractor who wishes to bid."},{"id":26,"theme":"Project Delivery and Contract Administration","question":"Which tendering method involves inviting only pre-screened contractors to submit bids?","options":{"A":"Open Tendering","B":"Selective Tendering","C":"Negotiated Tendering","D":"Framework Tendering"},"correct":"B","explanation":"Selective tendering restricts bidding to a shortlist of contractors who have been pre-screened for suitability."},{"id":27,"theme":"Project Delivery and Contract Administration","question":"In which tendering method does the client negotiate directly with a single, chosen contractor rather than run a competitive bid?","options":{"A":"Serial Tendering","B":"Open Tendering","C":"Negotiated Tendering","D":"Framework Tendering"},"correct":"C","explanation":"Negotiated tendering involves the client dealing directly with a chosen contractor instead of inviting competing bids."},{"id":28,"theme":"Project Delivery and Contract Administration","question":"Which stage of professional architectural services involves overseeing construction to ensure it complies with the approved design?","options":{"A":"Conceptual Design Phase","B":"Design Development Phase","C":"Construction Documentation","D":"Construction Administration"},"correct":"D","explanation":"Construction Administration is the stage where the architect oversees the building process to ensure it complies with the design."},{"id":29,"theme":"Project Delivery and Contract Administration","question":"Which of the following would typically be classified as an out-of-city reimbursable cost for an architect?","options":{"A":"Local courier fees within the same city","B":"Per diem allowance for an out-of-town site visit","C":"In-office printing costs","D":"Local phone calls to the client"},"correct":"B","explanation":"Out-of-city reimbursable costs cover expenses such as transportation, accommodation, and per diem allowances for out-of-town projects, unlike same-city costs which cover only local travel and incidentals."},{"id":30,"theme":"Project Delivery and Contract Administration","question":"Which dispute resolution method involves a neutral third party helping the parties resolve their conflict amicably, without imposing a binding decision?","options":{"A":"Mediation","B":"Litigation","C":"Arbitration","D":"Demolition Order"},"correct":"A","explanation":"Mediation uses a neutral third party to help parties reach an amicable resolution, unlike arbitration or litigation, which impose binding outcomes."},{"id":31,"theme":"Project Delivery and Contract Administration","question":"Which dispute resolution method involves a formal process in which an arbitrator makes a legally binding decision?","options":{"A":"Mediation","B":"Negotiation","C":"Arbitration","D":"Conciliation"},"correct":"C","explanation":"Arbitration is a formal process where an appointed arbitrator makes a decision that is binding on the parties."},{"id":32,"theme":"Project Delivery and Contract Administration","question":"What do completion certificates confirm about a construction project?","options":{"A":"That the project complies with regulatory standards and is safe for use","B":"That the architect has been paid in full","C":"That the client has taken out building insurance","D":"That the contractor's tender was the lowest bid"},"correct":"A","explanation":"Completion certificates are issued by local authorities or certifying bodies after final inspections, confirming a project meets regulatory standards and is safe for occupancy."},{"id":33,"theme":"Project Delivery and Contract Administration","question":"What is a Special Purpose Vehicle (SPV) in the context of architecture and construction?","options":{"A":"A legal entity created to manage financial risks and assets for a specific project","B":"A government agency that issues building permits","C":"A type of sustainable building material","D":"A specialized software used for structural analysis"},"correct":"A","explanation":"An SPV is a legal entity created to manage financial risk and assets for a specific project, and is commonly used in large-scale construction financing."},{"id":34,"theme":"Project Delivery and Contract Administration","question":"Who typically produces workshop drawings for prefabricated building components?","options":{"A":"Manufacturers or fabricators","B":"The client","C":"The local planning authority","D":"The building's future occupants"},"correct":"A","explanation":"Workshop drawings are created by manufacturers or fabricators to guide the production of prefabricated components."},{"id":35,"theme":"Project Delivery and Contract Administration","question":"Technical drawings that detail a building's design specifications are typically produced by whom?","options":{"A":"Manufacturers","B":"Architects and engineers","C":"Building surveyors","D":"Site laborers"},"correct":"B","explanation":"Technical drawings detailing design specifications are made by architects and engineers."},{"id":36,"theme":"Project Delivery and Contract Administration","question":"What is a Bill of Quantities (BoQ)?","options":{"A":"A predefined cost list for materials and labor commonly used in government tenders","B":"A detailed breakdown of all materials, labor, and work quantities required for a project","C":"A legal contract between an architect and a client","D":"A summary of a building's structural loads"},"correct":"B","explanation":"A Bill of Quantities is a detailed breakdown of all materials, labor, and work quantities required for a project, distinguishing it from a Schedule of Rates, which is a predefined cost list."},{"id":37,"theme":"Project Delivery and Contract Administration","question":"In a construction contract, what is a 'prime cost' sum?","options":{"A":"An estimated cost that is subject to change","B":"A fixed pricing allowance for specific named items, such as materials","C":"A legal order enforced by an authority","D":"A modification in the scope of work"},"correct":"B","explanation":"A prime cost sum is a fixed pricing allowance for specific named items such as materials, unlike a provisional sum, which is an estimate subject to change."},{"id":38,"theme":"Project Delivery and Contract Administration","question":"What is a 'provisional sum' in a construction contract?","options":{"A":"A fixed price allowance for specific named items","B":"An estimated cost included in a contract that is subject to change","C":"A binding arbitration decision","D":"A government decree"},"correct":"B","explanation":"A provisional sum is an estimated cost included in a contract that is subject to change once the actual scope is known."},{"id":39,"theme":"Project Delivery and Contract Administration","question":"What is the difference between a 'variation' and a 'valuation' in construction contract administration?","options":{"A":"A variation is a modification in the scope of work, while a valuation assesses construction costs and financial impact","B":"A variation is a legal decree, while a valuation is a court ruling","C":"A variation is a type of insurance, while a valuation is a type of permit","D":"They are two terms for the same process"},"correct":"A","explanation":"A variation refers to a change in the scope of work, while a valuation involves assessing the construction costs and financial impact of the works."},{"id":40,"theme":"Project Delivery and Contract Administration","question":"Which stage of the construction process typically includes structural work and MEP (mechanical, electrical, plumbing) installation?","options":{"A":"Planning & Design","B":"Preparation","C":"Execution","D":"Handover & Inspection"},"correct":"C","explanation":"The Execution stage covers structural work, MEP installation, and finishing, following planning/design and preparation."},{"id":41,"theme":"Project Delivery and Contract Administration","question":"Which of the following notices mandates an immediate halt to construction due to safety, legal, or regulatory concerns?","options":{"A":"Contravention Notice","B":"Stop Work Order","C":"Quit Notice","D":"Demand Notice"},"correct":"B","explanation":"A Stop Work Order mandates an immediate halt to construction activity due to safety, legal, or regulatory concerns."},{"id":42,"theme":"Project Delivery and Contract Administration","question":"Which of the following notices enforces the destruction of unauthorized or unsafe structures?","options":{"A":"Demolition Order","B":"Quit Notice","C":"Contravention Notice","D":"Demand Notice"},"correct":"A","explanation":"A Demolition Order enforces the destruction of structures that are unauthorized or unsafe."},{"id":43,"theme":"Project Delivery and Contract Administration","question":"Which notice is issued when a construction project violates building codes, without necessarily halting work immediately?","options":{"A":"Stop Work Order","B":"Contravention Notice","C":"Demolition Order","D":"Quit Notice"},"correct":"B","explanation":"A Contravention Notice is issued when a project violates building codes, flagging the violation for correction."},{"id":44,"theme":"Professionalism and Ethics","question":"Which of the following is NOT typically considered a primary responsibility of an architect?","options":{"A":"Designing construction documents","B":"Overseeing construction administration","C":"Conducting market research for real estate development","D":"Ensuring code compliance in a design"},"correct":"C","explanation":"While architects may consider market trends, conducting market research for real estate development is typically handled by real estate analysts, not architects."},{"id":45,"theme":"Professionalism and Ethics","question":"Why is ethical conduct important in architectural projects?","options":{"A":"It builds trust with clients and stakeholders","B":"It maintains professional credibility","C":"It ensures fair decision-making","D":"All of the above"},"correct":"D","explanation":"Ethical practice builds trust, maintains professional credibility, and ensures fair decision-making throughout a project."},{"id":46,"theme":"Professionalism and Ethics","question":"What does the ARCON Act stand for?","options":{"A":"Architects Registration Council of Nigeria Act","B":"Association of Registered Construction Officers of Nigeria Act","C":"Architectural Regulation and Compliance Oversight of Nigeria Act","D":"Architects Review Committee of Nigeria Act"},"correct":"A","explanation":"The ARCON Act refers to the Architects Registration Council of Nigeria Act, the legislation regulating the architectural profession in Nigeria."},{"id":47,"theme":"Professionalism and Ethics","question":"What is the purpose of the ARCON Act?","options":{"A":"To regulate the practice of architecture in Nigeria","B":"To set national building material prices","C":"To manage Nigeria's urban transportation systems","D":"To license construction equipment suppliers"},"correct":"A","explanation":"The ARCON Act establishes professional standards and legal guidelines for the practice of architecture in Nigeria."},{"id":48,"theme":"Professionalism and Ethics","question":"Who is responsible for enforcing the provisions of the ARCON Act?","options":{"A":"The Nigerian Institute of Architects (NIA)","B":"The Architects Registration Council of Nigeria (ARCON)","C":"The Federal Ministry of Works","D":"The Surveyors Council of Nigeria (SURCON)"},"correct":"B","explanation":"ARCON oversees architectural licensing and compliance and is responsible for enforcing the ARCON Act."},{"id":49,"theme":"Professionalism and Ethics","question":"What are the requirements for registration as an architect under the ARCON Act?","options":{"A":"Payment of an annual government tax only","B":"Completion of a recognized architectural education program and a minimum number of years of practical experience","C":"Ownership of an architectural firm","D":"Membership in a foreign architectural institute"},"correct":"B","explanation":"Registration under the ARCON Act requires completing a recognized architectural education program and obtaining a minimum amount of practical experience."},{"id":50,"theme":"Professionalism and Ethics","question":"Which of the following is a potential consequence of practicing architecture in Nigeria without ARCON registration?","options":{"A":"Fines and imprisonment","B":"Suspension or revocation of registration","C":"Ineligibility for government contracts","D":"All of the above"},"correct":"D","explanation":"Practicing without registration can lead to serious legal repercussions, including fines and imprisonment, suspension or revocation of registration, and ineligibility for government contracts."},{"id":51,"theme":"Professionalism and Ethics","question":"What is the purpose of the NIAPP examination, also known as the PPCE?","options":{"A":"To provide continuing education credits to registered architects","B":"To determine eligibility for registration as an architect","C":"To license architectural firms","D":"To certify building materials suppliers"},"correct":"B","explanation":"This examination ensures professional competence before an architect is certified for registration."},{"id":52,"theme":"Professionalism and Ethics","question":"What is the role of the Nigerian Institute of Architects (NIA) under the ARCON Act?","options":{"A":"To enforce disciplinary action against unregistered architects","B":"To provide professional development opportunities for architects","C":"To issue building permits","D":"To set national construction material standards"},"correct":"B","explanation":"The NIA supports architects through training, education, and networking opportunities."},{"id":53,"theme":"Professionalism and Ethics","question":"What is the purpose of the Code of Professional Conduct for architects under the ARCON Act?","options":{"A":"To standardize architectural drawing formats","B":"To promote ethical and professional conduct among architects","C":"To set minimum architectural fees nationwide","D":"To regulate the price of building materials"},"correct":"B","explanation":"The Code of Professional Conduct establishes the ethical framework that governs how architects practice."},{"id":54,"theme":"Professionalism and Ethics","question":"What is the role of the Architects Disciplinary Tribunal under the ARCON Act?","options":{"A":"To approve new building designs","B":"To enforce the provisions of the ARCON Act and handle cases of misconduct","C":"To issue architectural licenses to students","D":"To set national building codes"},"correct":"B","explanation":"The tribunal handles cases of professional misconduct and non-compliance with the ARCON Act."},{"id":55,"theme":"Professionalism and Ethics","question":"What is the purpose of the ARCON Act in relation to architectural education?","options":{"A":"To establish standards for architectural education in Nigeria","B":"To fund architecture scholarships","C":"To design university curricula for all disciplines","D":"To regulate tuition fees at architecture schools"},"correct":"A","explanation":"The ARCON Act ensures that accredited institutions provide proper training for aspiring architects."},{"id":56,"theme":"Professionalism and Ethics","question":"How is a 'client' defined by ARCON?","options":{"A":"Any government body overseeing construction projects","B":"An individual or entity that commissions an architect for professional services","C":"A contractor executing an architect's design","D":"A bank financing a construction project"},"correct":"B","explanation":"ARCON defines a client as an individual or entity that commissions an architect for professional services, including design, planning, supervision, and execution."},{"id":57,"theme":"Professionalism and Ethics","question":"Which of the following best describes an architect's core professional obligations?","options":{"A":"Ensuring a functional, safe, and aesthetically appropriate design while adhering to legal and environmental regulations and maintaining professional ethics","B":"Ensuring the building's construction is completed on time, regardless of design quality","C":"Ensuring the client's investment yields the maximum possible profit","D":"Providing only structural engineering calculations for the project"},"correct":"A","explanation":"An architect's obligations center on delivering a functional, safe, and appropriate design while adhering to legal, environmental, and ethical standards."},{"id":58,"theme":"Professionalism and Ethics","question":"What is significant about the use of the appellation 'Architect' in Nigeria?","options":{"A":"It can be used by anyone who has completed an architecture degree","B":"It is legally protected and can only be used by professionals registered with ARCON","C":"It can be used by any construction professional","D":"It is an honorary title with no legal restrictions"},"correct":"B","explanation":"The title 'Architect' is legally protected in Nigeria and reserved for professionals registered with ARCON or an equivalent regulatory body."},{"id":59,"theme":"Professionalism and Ethics","question":"In what year was ARCON established?","options":{"A":"1960","B":"1969","C":"1979","D":"1990"},"correct":"B","explanation":"ARCON was established in 1969 to regulate and oversee the practice of architecture in Nigeria."},{"id":60,"theme":"Professionalism and Ethics","question":"How many council members are there in ARCON?","options":{"A":"25","B":"35","C":"49","D":"60"},"correct":"C","explanation":"ARCON's governing council has 49 members."},{"id":61,"theme":"Professionalism and Ethics","question":"Who served as ARCON's first President?","options":{"A":"Arc. Fola Alade","B":"Arc. Kola Balogun","C":"Arc. Ade Bello","D":"Arc. Chidi Okonkwo"},"correct":"A","explanation":"Architect Fola Alade served as ARCON's first President, while Architect Kola Balogun served as its first Registrar."},{"id":62,"theme":"Professionalism and Ethics","question":"What does the ARCON 'Conditions of Engagement' document primarily outline?","options":{"A":"The list of all registered architects in Nigeria","B":"The scope of architects' services, responsibilities, and professional fees","C":"Zoning regulations for new developments","D":"Minimum wage requirements for construction workers"},"correct":"B","explanation":"The Conditions of Engagement document outlines the scope of an architect's services, responsibilities, and professional fees in Nigeria."},{"id":63,"theme":"Professionalism and Ethics","question":"What does APRN stand for in Nigerian architectural practice?","options":{"A":"Architects Practice Registration Number","B":"Architectural Project Review Notice","C":"Annual Professional Renewal Notification","D":"Architects Professional Rating Network"},"correct":"A","explanation":"APRN is a unique identifier assigned to registered architects in Nigeria for regulatory and professional tracking."},{"id":64,"theme":"Professionalism and Ethics","question":"What does SURCON stand for?","options":{"A":"Surveyors Council of Nigeria","B":"Society of Urban and Regional Consultants of Nigeria","C":"Structural Urban Research Council of Nigeria","D":"Sustainable Urban Resource Council of Nigeria"},"correct":"A","explanation":"SURCON is the Surveyors Council of Nigeria, the regulatory body for the surveying profession."},{"id":65,"theme":"Professionalism and Ethics","question":"What does TOPREC stand for?","options":{"A":"Town Planning Regulatory and Enforcement Commission","B":"Town Planners Registration Council","C":"Technical Operations and Planning Resource Council","D":"Town Practice Regulatory Council"},"correct":"B","explanation":"TOPREC is the Town Planners Registration Council, the body that regulates the town planning profession in Nigeria."},{"id":66,"theme":"Professionalism and Ethics","question":"What does QSRBN stand for?","options":{"A":"Quantity Surveyors Registration Board of Nigeria","B":"Quality Standards and Regulation Board of Nigeria","C":"Quantity Surveying Research Bureau of Nigeria","D":"Qualified Site Regulators Board of Nigeria"},"correct":"A","explanation":"QSRBN is the Quantity Surveyors Registration Board of Nigeria, the regulatory body for quantity surveyors."},{"id":67,"theme":"Professionalism and Ethics","question":"What does COREN stand for?","options":{"A":"Council for the Regulation of Engineering in Nigeria","B":"Council of Registered Environmental Nigerians","C":"Commission for Real Estate and Engineering in Nigeria","D":"Committee for the Regulation of Engineering Norms"},"correct":"A","explanation":"COREN is the Council for the Regulation of Engineering in Nigeria, the regulatory body for the engineering profession."},{"id":68,"theme":"Professionalism and Ethics","question":"Which type of easement allows passage through private property?","options":{"A":"Right-of-way easement","B":"Utility easement","C":"Prescriptive easement","D":"Conservation easement"},"correct":"A","explanation":"A right-of-way easement grants a party the right to pass through private property."},{"id":69,"theme":"Professionalism and Ethics","question":"Which type of easement provides access for electricity, water, and telecom services across a property?","options":{"A":"Right-of-way easement","B":"Utility easement","C":"Prescriptive easement","D":"Air rights easement"},"correct":"B","explanation":"A utility easement provides access for essential services such as electricity, water, and telecommunications."},{"id":70,"theme":"Professionalism and Ethics","question":"Which type of easement is a legal right gained through continued, open use of another's property over time?","options":{"A":"Utility easement","B":"Right-of-way easement","C":"Prescriptive easement","D":"Conservation easement"},"correct":"C","explanation":"A prescriptive easement is a right gained through continued use of a property over time, rather than through an explicit grant."},{"id":71,"theme":"Sustainability and Environment","question":"Which sustainable design strategy focuses on reducing a building's energy consumption using natural heating and cooling elements?","options":{"A":"Passive solar design","B":"Parametric design","C":"Modular construction","D":"Biomimicry"},"correct":"A","explanation":"Passive solar design enhances energy efficiency by utilizing natural heating and cooling elements rather than relying on mechanical systems."},{"id":72,"theme":"Sustainability and Environment","question":"What is the significance of LEED certification in architectural design?","options":{"A":"It recognizes buildings that meet high standards of sustainability and energy efficiency","B":"It certifies that a building meets minimum fire safety codes","C":"It confirms a building's structural stability","D":"It grants a building tax-exempt status"},"correct":"A","explanation":"LEED certification helps promote and recognize eco-friendly, energy-efficient construction."},{"id":73,"theme":"Sustainability and Environment","question":"What is the role of an architect in conducting a sustainability assessment during the pre-design phase?","options":{"A":"To minimize the impact of construction on the natural environment","B":"To calculate the final construction budget","C":"To select the building's furniture","D":"To draft the building permit application"},"correct":"A","explanation":"Architects assess energy use, material selection, and ecological factors during a sustainability assessment."},{"id":74,"theme":"Sustainability and Environment","question":"What is the purpose of conducting an environmental impact assessment (EIA) in architectural design?","options":{"A":"To secure a building permit from the local council","B":"To assess the environmental impact of a project, including pollution and biodiversity effects","C":"To calculate the total construction cost","D":"To evaluate the structural safety of a building"},"correct":"B","explanation":"EIA studies analyze pollution, biodiversity effects, and ecological balance associated with a proposed project."},{"id":75,"theme":"Sustainability and Environment","question":"What is the role of an architect in promoting energy efficiency in buildings?","options":{"A":"To design energy-efficient building systems and insulation","B":"To negotiate lower electricity tariffs with utility companies","C":"To manufacture energy-efficient appliances","D":"To set national energy policy"},"correct":"A","explanation":"Designing energy-efficient systems and insulation reduces a building's carbon footprint and utility costs."},{"id":76,"theme":"Sustainability and Environment","question":"What is the purpose of conducting a life cycle assessment in architectural design?","options":{"A":"To determine a building's resale value","B":"To assess a project's environmental impact throughout its entire life cycle","C":"To calculate the architect's professional fee","D":"To evaluate a building's aesthetic appeal"},"correct":"B","explanation":"A life cycle assessment evaluates environmental impact from a building's design through to its eventual demolition, helping optimize sustainability at every stage."},{"id":77,"theme":"Sustainability and Environment","question":"Which of the following strategies can architects use to reduce waste during the construction process?","options":{"A":"Recycling construction materials, using prefabricated components, and minimizing packaging waste","B":"Increasing the use of single-use packaging for deliveries","C":"Specifying only new, non-recycled materials","D":"Scheduling more frequent site deliveries"},"correct":"A","explanation":"Sustainable materials management, including recycling and prefabrication, reduces environmental harm during construction."},{"id":78,"theme":"Sustainability and Environment","question":"Which strategies can architects use to promote occupant well-being in buildings?","options":{"A":"Incorporating biophilic design elements, natural views, and comfortable indoor environments","B":"Minimizing all window openings to reduce heat gain","C":"Using only artificial lighting throughout the building","D":"Reducing ceiling heights to save on materials"},"correct":"A","explanation":"A well-designed space that incorporates natural elements and comfortable conditions improves occupants' physical and mental well-being."},{"id":79,"theme":"Sustainability and Environment","question":"What is the role of an architect in promoting water conservation in buildings?","options":{"A":"To design water-efficient plumbing fixtures and irrigation systems","B":"To manage the municipal water supply","C":"To set water tariffs for building occupants","D":"To manufacture water storage tanks"},"correct":"A","explanation":"Sustainable water management, through efficient fixtures and irrigation, reduces waste and encourages responsible use."},{"id":80,"theme":"Sustainability and Environment","question":"What is the role of an architect in promoting sustainable transportation in building design?","options":{"A":"To incorporate bicycle parking, electric vehicle charging stations, and pedestrian-friendly design elements","B":"To design and manufacture public transit vehicles","C":"To set national fuel efficiency standards","D":"To operate a building's parking garage"},"correct":"A","explanation":"Sustainable mobility features such as bicycle parking and EV charging help reduce a building's transportation-related emissions."},{"id":81,"theme":"Sustainability and Environment","question":"Which strategies can architects use to promote sustainable materials selection in building design?","options":{"A":"Use of locally sourced materials, recycled materials, and low-VOC products","B":"Specifying only imported, high-carbon materials","C":"Avoiding recycled content entirely","D":"Prioritizing materials solely based on lowest upfront cost"},"correct":"A","explanation":"Eco-friendly materials such as locally sourced, recycled, and low-VOC products improve indoor air quality and reduce environmental impact."},{"id":82,"theme":"Sustainability and Environment","question":"What is the definition of sustainable architecture?","options":{"A":"Designing buildings that have a minimal impact on the environment","B":"Designing buildings using only imported materials","C":"Designing buildings with the lowest possible construction cost","D":"Designing buildings exclusively in a modernist style"},"correct":"A","explanation":"Sustainable architecture prioritizes energy efficiency and eco-friendly materials to minimize environmental impact."},{"id":83,"theme":"Sustainability and Environment","question":"What is the purpose of incorporating biophilic design principles in architecture?","options":{"A":"To reduce a building's construction cost","B":"To promote a connection between humans and nature","C":"To maximize the number of floors in a building","D":"To simplify structural engineering calculations"},"correct":"B","explanation":"Biophilic design enhances occupant well-being by incorporating natural elements into the built environment."},{"id":84,"theme":"Sustainability and Environment","question":"What is the purpose of incorporating green roofs in architecture?","options":{"A":"To provide additional green space and reduce stormwater runoff","B":"To increase a building's height allowance","C":"To reduce the need for structural foundations","D":"To eliminate the need for a roof drainage system"},"correct":"A","explanation":"Green roofs provide additional green space, reduce stormwater runoff, and also improve insulation and urban air quality."},{"id":85,"theme":"Sustainability and Environment","question":"What is the purpose of incorporating green walls in architecture?","options":{"A":"To provide additional green space and improve air quality","B":"To increase a building's structural load capacity","C":"To reduce the need for window openings","D":"To serve as a fire barrier"},"correct":"A","explanation":"Vertical gardens (green walls) enhance urban aesthetics, improve air quality, and reduce heat absorption."},{"id":86,"theme":"Sustainability and Environment","question":"Which of the following is an example of an active energy source in building design?","options":{"A":"Passive solar heating","B":"Natural wind ventilation","C":"Solar panels","D":"Daylighting through window placement"},"correct":"C","explanation":"Active energy sources require mechanical systems, such as solar panels or geothermal heating, unlike passive sources like passive solar heating or natural ventilation."},{"id":87,"theme":"Sustainability and Environment","question":"What does BREEAM stand for?","options":{"A":"Building Research Establishment Environmental Assessment Method","B":"Building Regulation and Energy Efficiency Assessment Model","C":"British Renewable Energy and Environmental Accreditation Method","D":"Building Resource and Ecological Assessment Metric"},"correct":"A","explanation":"BREEAM stands for the Building Research Establishment Environmental Assessment Method, a sustainability rating system for buildings."},{"id":88,"theme":"Sustainability and Environment","question":"What does LEED stand for?","options":{"A":"Leadership in Energy and Environmental Design","B":"Low Energy and Environmental Development","C":"Leadership in Efficient Engineering and Design","D":"Local Energy and Environmental Directive"},"correct":"A","explanation":"LEED stands for Leadership in Energy and Environmental Design, a widely used green building certification system."},{"id":89,"theme":"Structures and Building Technology","question":"What is the purpose of a building code in architectural design?","options":{"A":"To ensure the safety and structural integrity of a building","B":"To determine the building's resale value","C":"To select the interior color scheme","D":"To calculate the architect's professional fee"},"correct":"A","explanation":"Building codes set regulations for construction, materials, and design practices to protect occupants and ensure structural safety."},{"id":90,"theme":"Structures and Building Technology","question":"What is the difference between a load-bearing wall and a non-load-bearing wall?","options":{"A":"Load-bearing walls support the weight of the structure, while non-load-bearing walls serve only as partitions","B":"Load-bearing walls are always made of glass, while non-load-bearing walls are made of concrete","C":"Non-load-bearing walls support the roof, while load-bearing walls do not","D":"There is no functional difference between the two"},"correct":"A","explanation":"Load-bearing walls carry structural loads, while non-load-bearing walls serve only as space-dividing partitions."},{"id":91,"theme":"Structures and Building Technology","question":"What is the purpose of a building envelope in architectural design?","options":{"A":"To regulate the flow of air and moisture within a building","B":"To determine the building's floor area ratio","C":"To define the property's legal boundary","D":"To calculate a building's occupancy load"},"correct":"A","explanation":"The building envelope helps with insulation, ventilation, and climate control by regulating air and moisture flow."},{"id":92,"theme":"Structures and Building Technology","question":"What is the purpose of conducting a health and safety assessment in architectural design?","options":{"A":"To ensure compliance with local health and safety regulations","B":"To calculate the total project cost","C":"To select the building's exterior cladding","D":"To determine the architect's fee structure"},"correct":"A","explanation":"Architects must consider health and safety standards to protect both occupants and workers."},{"id":93,"theme":"Structures and Building Technology","question":"Which of the following are common health and safety hazards that architects should consider in their designs?","options":{"A":"Fire hazards, electrical hazards, and ergonomic hazards","B":"Market fluctuations and currency exchange risks","C":"Software licensing and copyright issues","D":"Client scheduling conflicts"},"correct":"A","explanation":"Fire, electrical, and ergonomic hazards are key factors that influence design choices for safer built environments."},{"id":94,"theme":"Structures and Building Technology","question":"What is a retaining wall?","options":{"A":"A structure designed to hold or support soil behind it, preventing erosion","B":"A decorative wall used only for interior partitions","C":"A wall built exclusively to display artwork","D":"A temporary wall used only during construction"},"correct":"A","explanation":"A retaining wall holds or supports soil behind it, preventing erosion and maintaining stability on sloped landscapes."},{"id":95,"theme":"Structures and Building Technology","question":"What is the typical minimum size of a disabled (accessible) toilet?","options":{"A":"1.0m x 1.5m","B":"1.5m x 2.2m","C":"2.0m x 3.0m","D":"0.9m x 1.2m"},"correct":"B","explanation":"A minimum size of 1.5m x 2.2m is typically required for a disabled toilet to ensure wheelchair accessibility."},{"id":96,"theme":"Structures and Building Technology","question":"Which foundation type is generally best suited for a sloped site?","options":{"A":"Raft foundation","B":"Pad foundation","C":"Pile foundation","D":"Strip foundation"},"correct":"C","explanation":"Pile foundations (often combined with stepped footings) provide stability and help prevent soil erosion on sloped sites."},{"id":97,"theme":"Structures and Building Technology","question":"What are 'chairs' in reinforced concrete construction?","options":{"A":"Reinforcement bar supports used to maintain the correct placement of steel within a slab","B":"Decorative elements added to concrete facades","C":"Temporary formwork supports removed after curing","D":"Chemical additives that accelerate curing time"},"correct":"A","explanation":"Chairs are supports that hold reinforcement bars in their correct position within a concrete slab before and during pouring."},{"id":98,"theme":"Structures and Building Technology","question":"Which concrete grade is typically specified for heavy-duty commercial structures?","options":{"A":"C15","B":"C25","C":"C40","D":"C60+"},"correct":"C","explanation":"C40 concrete is typically used for heavy-duty commercial structures, while C15 suits basic foundations, C25 suits residential foundations and beams, and C60+ is reserved for high-strength engineering projects."},{"id":99,"theme":"Building Services","question":"What is the purpose of a lighting plan in architectural design?","options":{"A":"To create a visually appealing atmosphere within a building","B":"To calculate a building's structural load","C":"To determine property tax rates","D":"To select the building's landscaping plants"},"correct":"A","explanation":"Lighting plans enhance aesthetics, functionality, and energy efficiency within a building."},{"id":100,"theme":"Building Services","question":"What is the role of an architect in promoting a healthy indoor environment?","options":{"A":"To maximize the use of natural lighting and ventilation in a building's design","B":"To install only artificial lighting throughout the building","C":"To seal all windows to reduce outdoor noise","D":"To minimize the number of building entrances"},"correct":"A","explanation":"Maximizing natural lighting and ventilation enhances air quality and occupant well-being."},{"id":101,"theme":"Building Services","question":"Which strategies can architects use to mitigate noise pollution in buildings?","options":{"A":"Use of sound-absorbing materials, acoustic insulation, and strategic placement of windows and doors","B":"Increasing the number of hard, reflective interior surfaces","C":"Placing bedrooms directly adjacent to mechanical equipment rooms","D":"Removing all interior partition walls"},"correct":"A","explanation":"Thoughtful planning with sound-absorbing materials and acoustic insulation minimizes noise disturbances for occupants."},{"id":102,"theme":"Building Services","question":"Which strategies can architects use to promote good indoor air quality in buildings?","options":{"A":"Use of low-VOC materials, proper ventilation systems, and regular HVAC maintenance","B":"Sealing buildings completely to prevent any air exchange","C":"Using only synthetic, high-VOC finishing materials","D":"Minimizing the number of ventilation ducts"},"correct":"A","explanation":"Low-VOC materials, effective ventilation, and well-maintained HVAC systems ensure clean, breathable indoor environments."},{"id":103,"theme":"Building Services","question":"What is the purpose of incorporating daylighting in architecture?","options":{"A":"To reduce the need for structural steel","B":"To maximize natural light and reduce the need for artificial lighting","C":"To eliminate the need for window treatments","D":"To increase a building's acoustic insulation"},"correct":"B","explanation":"Daylighting strategies enhance occupant well-being and improve energy efficiency by reducing reliance on artificial lighting."},{"id":104,"theme":"Building Services","question":"What is a sump in a building's drainage system?","options":{"A":"A pit or reservoir used to collect excess water, often to prevent flooding","B":"A type of roof truss used in sloped roofs","C":"A decorative water feature in a building's lobby","D":"A structural column used to support a mezzanine floor"},"correct":"A","explanation":"A sump is a pit or reservoir, often found in basements or drainage systems, used to collect excess water and prevent flooding."},{"id":105,"theme":"Building Services","question":"Which of the following best describes a comprehensive approach to fire safety in building design?","options":{"A":"Installing sprinklers only, since they extinguish fires automatically","B":"Relying solely on fire-resistant materials","C":"Providing emergency exits only, since occupants can then evacuate","D":"A combination of fire-resistant materials, clear exit routes, smoke control systems, and sprinklers and alarms"},"correct":"D","explanation":"Comprehensive fire safety combines fire-resistant materials, proper exit routes, smoke control systems, and sprinklers and alarms, rather than relying on any single measure alone."},{"id":106,"theme":"Design and Construction","question":"Which architectural software is commonly used for creating detailed construction drawings?","options":{"A":"AutoCAD","B":"Photoshop","C":"Microsoft Excel","D":"Premiere Pro"},"correct":"A","explanation":"AutoCAD is widely used for precision drafting and technical construction documentation."},{"id":107,"theme":"Design and Construction","question":"What is the purpose of a building section in architectural drawings?","options":{"A":"To illustrate the building's structural components via a vertical cut-through view","B":"To show the building's location within its site","C":"To list the project's bill of quantities","D":"To display the building's furniture layout"},"correct":"A","explanation":"A section drawing provides a vertical cut-through view of a building, showing its structural components and floor arrangement."},{"id":108,"theme":"Design and Construction","question":"What is the primary responsibility of an architect during the design phase of a project?","options":{"A":"Creating detailed construction drawings and blueprints","B":"Independently performing all structural engineering calculations","C":"Securing project financing from lenders","D":"Conducting geotechnical soil testing"},"correct":"A","explanation":"During the design phase, architects develop the technical and aesthetic components of a design, including construction drawings and blueprints."},{"id":109,"theme":"Design and Construction","question":"What is the role of an architect in interior design?","options":{"A":"Creating a functional and aesthetically pleasing layout for a space","B":"Manufacturing furniture for the space","C":"Setting the retail price of furnishings","D":"Managing the building's ongoing cleaning services"},"correct":"A","explanation":"Architects design layouts that optimize both space utilization and visual appeal."},{"id":110,"theme":"Design and Construction","question":"What is the purpose of building information modeling (BIM) software in architectural design?","options":{"A":"To facilitate collaboration and coordination among project stakeholders","B":"To replace the need for a building permit","C":"To automatically generate a project's financing","D":"To calculate an architect's professional fee"},"correct":"A","explanation":"BIM allows architects, engineers, and contractors to work together efficiently by coordinating design information."},{"id":111,"theme":"Design and Construction","question":"What is the purpose of a conceptual design phase in architecture?","options":{"A":"To finalize construction contracts with the chosen contractor","B":"To develop a preliminary design concept based on the client's needs and goals","C":"To issue the building's completion certificate","D":"To conduct the final structural inspection"},"correct":"B","explanation":"The conceptual design phase involves rough sketches and foundational ideas based on the client's needs and goals."},{"id":112,"theme":"Design and Construction","question":"What is the role of technology in modern architecture?","options":{"A":"To eliminate the need for architects entirely","B":"To improve the efficiency and functionality of buildings","C":"To replace all traditional building materials","D":"To reduce the number of design options available"},"correct":"B","explanation":"Smart technology enhances automation, climate control, and security, improving a building's efficiency and functionality."},{"id":113,"theme":"Design and Construction","question":"What is the concept of parametric design in architecture?","options":{"A":"Designing buildings based on mathematical algorithms and parameters","B":"Designing buildings using only hand-drawn sketches","C":"Designing buildings solely to minimize construction cost","D":"Designing buildings without any computer software"},"correct":"A","explanation":"Parametric design uses mathematical algorithms and parameters, allowing architects to create dynamic and unique structures."},{"id":114,"theme":"Design and Construction","question":"What is the concept of biomimicry in architecture?","options":{"A":"Designing buildings that mimic natural forms and processes","B":"Designing buildings exclusively from recycled steel","C":"Designing buildings without any exterior windows","D":"Designing buildings that replicate historical monuments"},"correct":"A","explanation":"Biomimicry draws inspiration from nature's efficient structures and processes to inform building design."},{"id":115,"theme":"Design and Construction","question":"What is the concept of modular construction in architecture?","options":{"A":"Designing buildings entirely from glass and steel","B":"Designing buildings using prefabricated modules","C":"Designing buildings without any structural framework","D":"Designing buildings exclusively underground"},"correct":"B","explanation":"Modular construction speeds up building processes and reduces waste by using prefabricated modules."},{"id":116,"theme":"Design and Construction","question":"What is the concept of universal design in architecture?","options":{"A":"Designing buildings that are accessible to all individuals, regardless of ability","B":"Designing buildings only for luxury residential use","C":"Designing buildings using a single, standardized floor plan worldwide","D":"Designing buildings exclusively for commercial use"},"correct":"A","explanation":"Universal design ensures inclusivity for people of all abilities, including those with disabilities."},{"id":117,"theme":"Design and Construction","question":"What does the 'kitchen triangle' refer to in architectural design?","options":{"A":"The optimal arrangement of the sink, stove, and refrigerator to maximize efficiency","B":"The arrangement of the oven, dishwasher, and microwave","C":"A structural bracing pattern used in roof trusses","D":"The three main entrances to a commercial kitchen"},"correct":"A","explanation":"The kitchen triangle describes the efficient positioning of the sink, stove, and refrigerator to minimize movement during food preparation."},{"id":118,"theme":"History and Theory of Architecture","question":"Which architectural style is characterized by clean lines, minimal ornamentation, and open floor plans?","options":{"A":"Modernism","B":"Baroque","C":"Gothic Revival","D":"Postmodernism"},"correct":"A","explanation":"Modernism emphasizes simplicity, functionality, and a lack of excessive decoration."},{"id":119,"theme":"History and Theory of Architecture","question":"What is the role of an architect in historic preservation?","options":{"A":"Restoring and renovating historic buildings while maintaining their historical integrity","B":"Demolishing older buildings to make way for new construction","C":"Converting all historic buildings into museums","D":"Removing original architectural details to modernize a building"},"correct":"A","explanation":"Architects working in historic preservation restore and renovate historic buildings while maintaining their historical integrity for modern use."},{"id":120,"theme":"History and Theory of Architecture","question":"What is the concept of adaptive reuse in architecture?","options":{"A":"Repurposing existing buildings for new uses","B":"Demolishing old buildings to build modern replacements","C":"Constructing new buildings using only reclaimed land","D":"Designing buildings that mimic historic styles from scratch"},"correct":"A","explanation":"Adaptive reuse repurposes existing buildings for new functions, reducing waste and preserving architectural heritage."},{"id":121,"theme":"History and Theory of Architecture","question":"What is the concept of minimalism in architecture?","options":{"A":"Designing buildings that use simple forms and materials","B":"Designing buildings with heavily ornamented facades","C":"Designing buildings with as many rooms as possible","D":"Designing buildings using only historical references"},"correct":"A","explanation":"Minimalist architecture prioritizes clean lines, simple forms, and functional spaces."},{"id":122,"theme":"History and Theory of Architecture","question":"What is the concept of contextualism in architecture?","options":{"A":"Designing buildings that respond to their surroundings and context","B":"Designing buildings without regard to their site or surroundings","C":"Designing buildings using only imported design styles","D
