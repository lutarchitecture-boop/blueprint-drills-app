tion Number","D":"Association of Practicing Registered Nationals"},"correct":"B","explanation":"APRN refers to the ARCON Project Registration Number, the identifier ARCON assigns when a project is registered with the council as required for professional practice."},{"id":302,"theme":"Pre-Design Planning and Practice Management","question":"The initial stage of the design process is typically the:","options":{"A":"Construction documentation phase","B":"Detailed design phase","C":"Design development phase","D":"Brief-taking phase"},"correct":"D","explanation":"Before any design work can begin, the architect must first gather the client's brief, which establishes needs and objectives, making it the initial stage."},{"id":303,"theme":"Pre-Design Planning and Practice Management","question":"Brief-taking involves:","options":{"A":"Presenting the final design to the client","B":"Gathering the client's needs, requirements, and objectives","C":"Preparing the construction drawings","D":"Supervising the construction on site"},"correct":"B","explanation":"Brief-taking is the process of consulting with the client to understand and document their needs, requirements, and project objectives before design begins."},{"id":304,"theme":"Pre-Design Planning and Practice Management","question":"Feasibility studies are conducted to:","options":{"A":"Prepare detailed construction costs","B":"Determine the viability and potential success of a project","C":"Create the initial sketch designs","D":"Obtain building approvals"},"correct":"B","explanation":"A feasibility study assesses whether a proposed project is practical and likely to succeed, considering factors like site, cost, and market conditions."},{"id":305,"theme":"Pre-Design Planning and Practice Management","question":"Cost information is crucial during the design process to:","options":{"A":"Ensure the architect's fees are maximized","B":"Keep the design aligned with the client's budget","C":"Delay project commencement","D":"Make the design unnecessarily extravagant"},"correct":"B","explanation":"Continuously tracking cost information during design ensures the evolving design stays within the client's approved budget."},{"id":306,"theme":"Pre-Design Planning and Practice Management","question":"A project implementation strategy outlines:","options":{"A":"The architect's personal design philosophy","B":"The methods and timelines for executing the project","C":"The client's financial background","D":"The local weather patterns during construction"},"correct":"B","explanation":"A project implementation strategy sets out how and when a project will be executed, including procurement methods, phasing, and timelines."},{"id":307,"theme":"Pre-Design Planning and Practice Management","question":"Site analysis involves:","options":{"A":"Designing the building layout without considering the context","B":"Evaluating the physical, environmental, and contextual characteristics of the site","C":"Ignoring existing site features","D":"Assuming all sites are identical"},"correct":"B","explanation":"Site analysis is the systematic study of a site's physical, environmental, and contextual conditions to inform an appropriate design response."},{"id":308,"theme":"Pre-Design Planning and Practice Management","question":"The concept design phase focuses on:","options":{"A":"Developing detailed construction specifications","B":"Generating initial ideas and schematic layouts","C":"Selecting the final building materials","D":"Obtaining contractor bids"},"correct":"B","explanation":"Concept design is an early stage where broad ideas and schematic layouts are explored, well before construction specifications or material selections are finalized."},{"id":309,"theme":"Pre-Design Planning and Practice Management","question":"Detailed design involves:","options":{"A":"Creating broad design concepts","B":"Developing precise drawings and specifications for construction","C":"Presenting preliminary sketches to the client","D":"Overseeing the initial site clearing"},"correct":"B","explanation":"Detailed design is the stage where the concept is translated into precise, buildable drawings and specifications ready for construction."},{"id":310,"theme":"Pre-Design Planning and Practice Management","question":"Technical design primarily focuses on:","options":{"A":"The aesthetic appearance of the building","B":"The functional performance and construction detailing of the building systems","C":"The client's personal preferences for interior decor","D":"The marketing strategy for the completed building"},"correct":"B","explanation":"Technical design deals with how building systems actually perform and are constructed, such as structural, mechanical, and detailing considerations."},{"id":311,"theme":"Pre-Design Planning and Practice Management","question":"Design drawings communicate:","options":{"A":"Only the artistic intent of the architect","B":"The visual and spatial aspects of the design","C":"The detailed cost breakdown of the project","D":"The legal ownership of the land"},"correct":"B","explanation":"Design drawings are the primary tool for conveying a building's visual appearance and spatial organization to clients and the project team."},{"id":312,"theme":"Pre-Design Planning and Practice Management","question":"Sketch design and presentation are used to:","options":{"A":"Finalize all construction details","B":"Communicate initial design ideas to the client for feedback","C":"Obtain final building permits","D":"Instruct the contractor on construction methods"},"correct":"B","explanation":"Sketch designs are preliminary and presented to clients specifically to gather feedback before the design is developed further."},{"id":313,"theme":"Pre-Design Planning and Practice Management","question":"Drawing coordination across consulting disciplines ensures:","options":{"A":"Each consultant works independently without reference to others","B":"All aspects of the building design are integrated and compatible","C":"The architect's drawings are the only ones that matter","D":"Conflicts between different systems are resolved on site"},"correct":"B","explanation":"Coordinating drawings across architectural, structural, and services disciplines ensures the different systems fit together correctly before construction, avoiding costly site conflicts."},{"id":314,"theme":"Pre-Design Planning and Practice Management","question":"A Design Responsibility Matrix clarifies:","options":{"A":"The payment schedule for the consultants","B":"Who is responsible for specific design tasks and deliverables","C":"The architect's personal liability for design errors","D":"The client's role in the design process"},"correct":"B","explanation":"A Design Responsibility Matrix is a project management tool that assigns and clarifies which consultant is responsible for each design task or deliverable."},{"id":315,"theme":"Pre-Design Planning and Practice Management","question":"BIM stands for:","options":{"A":"Basic Information Management","B":"Building Information Modeling","C":"Business Intelligence Model","D":"Built Infrastructure Management"},"correct":"B","explanation":"BIM stands for Building Information Modeling, a process for creating and managing digital representations of a building's physical and functional characteristics."},{"id":316,"theme":"Pre-Design Planning and Practice Management","question":"A key advantage of using CAD software in architectural design is:","options":{"A":"Increased manual drafting speed","B":"Improved accuracy and efficiency in drawing production","C":"Reduced collaboration among design team members","D":"Limited ability to visualize designs in 3D"},"correct":"B","explanation":"CAD software improves the accuracy and speed of producing drawings compared to manual drafting, and enhances rather than limits collaboration and 3D visualization."},{"id":317,"theme":"Pre-Design Planning and Practice Management","question":"Building Information Modeling (BIM) allows for:","options":{"A":"Creating only 2D drawings","B":"Managing building data throughout its lifecycle","C":"Eliminating the need for collaboration","D":"Producing only basic geometric models"},"correct":"B","explanation":"BIM's core strength is capturing and managing rich building data across the entire project lifecycle, from design through construction and facility management."},{"id":318,"theme":"Pre-Design Planning and Practice Management","question":"Energy analysis software can help architects to:","options":{"A":"Design aesthetically pleasing buildings without considering energy use","B":"Simulate and optimize a building's energy performance","C":"Increase the energy consumption of buildings","D":"Only analyze the structural integrity of a building"},"correct":"B","explanation":"Energy analysis software models how a building will perform energy-wise, allowing architects to simulate and optimize design decisions for efficiency."},{"id":319,"theme":"Pre-Design Planning and Practice Management","question":"Effective presentation formats for architectural designs include:","options":{"A":"Only text-based descriptions","B":"A combination of drawings, renderings, and models","C":"Avoiding any visual aids to focus on verbal explanations","D":"Using only technical construction drawings for client presentations"},"correct":"B","explanation":"Effective presentations use a mix of drawings, renderings, and models so clients can understand the design from multiple visual perspectives."},{"id":320,"theme":"Pre-Design Planning and Practice Management","question":"Environmental Impact Assessment (EIA) is a process used to:","options":{"A":"Speed up construction approvals","B":"Evaluate the potential environmental consequences of a project","C":"Ignore environmental concerns in development","D":"Only focus on the economic benefits of a project"},"correct":"B","explanation":"An EIA systematically identifies and evaluates the likely environmental effects of a proposed project before it proceeds."},{"id":321,"theme":"Pre-Design Planning and Practice Management","question":"Sustainability in architecture refers to:","options":{"A":"Designing buildings that are only aesthetically pleasing","B":"Meeting the needs of the present without compromising the ability of future generations to meet their own needs","C":"Using only expensive and imported materials","D":"Ignoring the long-term environmental and social impacts of buildings"},"correct":"B","explanation":"This is the widely accepted (Brundtland) definition of sustainability, balancing present needs against the ability of future generations to meet their own."},{"id":322,"theme":"Pre-Design Planning and Practice Management","question":"Environmental factors in energy policy for buildings include:","options":{"A":"Ignoring the source of energy used","B":"Promoting the use of renewable energy sources","C":"Encouraging wasteful energy consumption","D":"Focusing solely on the initial cost of energy systems"},"correct":"B","explanation":"Sound energy policy for buildings actively promotes renewable energy sources to reduce environmental impact, rather than ignoring energy source or long-term efficiency."},{"id":323,"theme":"Pre-Design Planning and Practice Management","question":"Environmental factors in material policy involve considering:","options":{"A":"Only the initial cost of building materials","B":"The embodied energy and lifecycle impact of materials","C":"Using only non-renewable resources","D":"Disregarding the environmental impact of material extraction and production"},"correct":"B","explanation":"Environmentally responsible material policy accounts for a material's embodied energy and full lifecycle impact, not just its purchase price."},{"id":324,"theme":"Pre-Design Planning and Practice Management","question":"The effects of material and energy policy on the Construction Industry can include:","options":{"A":"Increased demand for unsustainable practices","B":"Innovation in green building technologies and materials","C":"Reduced focus on energy efficiency","D":"Higher costs without any environmental benefits"},"correct":"B","explanation":"Stricter material and energy policies typically drive the construction industry to innovate, developing new green technologies and materials."},{"id":325,"theme":"Pre-Design Planning and Practice Management","question":"Political, economic, and social factors in architectural decision-making can influence:","options":{"A":"Only the technical aspects of building design","B":"The type of projects undertaken and the design approaches adopted","C":"The architect's personal design preferences only","D":"The structural integrity of buildings"},"correct":"B","explanation":"Broader political, economic, and social conditions shape which projects get commissioned and the design approaches that are viable or favored, beyond purely technical concerns."},{"id":326,"theme":"Pre-Design Planning and Practice Management","question":"Green architecture aims to:","options":{"A":"Create buildings that are only painted green","B":"Minimize the negative environmental impact of buildings","C":"Increase the carbon footprint of the construction industry","D":"Disregard energy efficiency and sustainable materials"},"correct":"B","explanation":"Green architecture is an approach to building design that seeks to reduce the negative environmental footprint of buildings through efficient resource use."},{"id":327,"theme":"Pre-Design Planning and Practice Management","question":"Climate-responsive architecture considers:","options":{"A":"Designing buildings that are identical in all climate zones","B":"Adapting building design to the local climate to enhance comfort and reduce energy use","C":"Ignoring the prevailing weather conditions","D":"Maximizing energy consumption for heating and cooling"},"correct":"B","explanation":"Climate-responsive design tailors a building's form and features to local climatic conditions to improve occupant comfort while reducing energy demand."},{"id":328,"theme":"Pre-Design Planning and Practice Management","question":"Tropical architecture often emphasizes:","options":{"A":"Designs that retain heat","B":"Natural ventilation and shading to manage high temperatures and humidity","C":"Small windows and limited airflow","D":"Heavy reliance on air conditioning"},"correct":"B","explanation":"Tropical architecture is characterized by passive strategies like natural ventilation and shading devices to manage heat and humidity without heavy mechanical reliance."},{"id":329,"theme":"Pre-Design Planning and Practice Management","question":"Passive energy strategies in buildings rely on:","options":{"A":"Mechanical and electrical systems for heating and cooling","B":"The building's design and natural environmental conditions to regulate temperature and lighting","C":"Ignoring solar heat gain and natural ventilation","D":"High-energy consumption technologies"},"correct":"B","explanation":"Passive strategies use a building's form, orientation, and materials together with natural environmental conditions to regulate comfort, without relying on mechanical systems."},{"id":330,"theme":"Pre-Design Planning and Practice Management","question":"Active energy systems in buildings involve:","options":{"A":"Utilizing natural sunlight for illumination without any technology","B":"Using mechanical and electrical equipment like solar panels and efficient HVAC systems","C":"Relying solely on natural ventilation for cooling","D":"Avoiding any form of energy-saving technology"},"correct":"B","explanation":"Active energy systems, unlike passive strategies, use mechanical and electrical equipment such as solar panels and HVAC systems to manage a building's energy needs."},{"id":331,"theme":"Project Delivery and Contract Administration","question":"Which drawing provides a bird's-eye view of the building's layout at each level?","options":{"A":"Elevation","B":"Section","C":"Floor Plan","D":"Site Plan"},"correct":"C","explanation":"A floor plan is a horizontal cutaway view showing room layout, walls, doors and windows at a given level, giving a top-down 'bird's-eye' view of the building's arrangement."},{"id":332,"theme":"Project Delivery and Contract Administration","question":"What type of drawing shows the vertical cut through a building?","options":{"A":"Elevation","B":"Section","C":"Floor Plan","D":"Roof Plan"},"correct":"B","explanation":"A section drawing represents a vertical cut through a building, revealing internal heights, floor-to-floor relationships, and construction elements not visible in plan view."},{"id":333,"theme":"Project Delivery and Contract Administration","question":"Which drawing depicts the exterior appearance of a building from a specific viewpoint?","options":{"A":"Section","B":"Roof Plan","C":"Elevation","D":"Site Plan"},"correct":"C","explanation":"An elevation shows the external face of a building as viewed from one side (e.g., front, rear), depicting its appearance, proportions and materials."},{"id":334,"theme":"Project Delivery and Contract Administration","question":"The drawing that indicates the arrangement of lighting fixtures and other elements on the ceiling is called a:","options":{"A":"Electrical Layout","B":"Reflected Floor Plan","C":"Reflected Ceiling Plan","D":"Lighting Section"},"correct":"C","explanation":"A reflected ceiling plan (RCP) is a mirror-image plan view looking upward, used to show the layout of light fixtures, ceiling finishes, and other ceiling-mounted elements."},{"id":335,"theme":"Project Delivery and Contract Administration","question":"Which drawing illustrates the layout of the building within the property boundaries?","options":{"A":"Floor Plan","B":"Landscape Drawing","C":"Site Plan","D":"Location Drawing"},"correct":"D","explanation":"A location drawing shows how a building sits within the boundaries of its plot, including setbacks and orientation relative to the property lines."},{"id":336,"theme":"Project Delivery and Contract Administration","question":"Details of planting, paving, and other exterior elements are found in:","options":{"A":"Site Plan","B":"Floor Plan","C":"Landscape Drawings","D":"Elevation Details"},"correct":"C","explanation":"Landscape drawings document soft and hard landscaping details such as planting schemes, paving patterns, and other external site elements."},{"id":337,"theme":"Project Delivery and Contract Administration","question":"Detailed drawings of cabinets, countertops, and appliance layouts are part of:","options":{"A":"Interior Elevations","B":"Kitchen Design Detailing","C":"Millwork Sections","D":"Appliance Schedules"},"correct":"B","explanation":"Kitchen design detailing drawings focus specifically on cabinetry, countertops, and appliance placement to guide fabrication and installation in that space."},{"id":338,"theme":"Project Delivery and Contract Administration","question":"Drawings showing the placement of sanitary fixtures, tiling patterns, and accessories are included in:","options":{"A":"Plumbing Layouts","B":"Bathroom and Toilet Design Detailing","C":"Sanitary Sections","D":"Fixture Schedules"},"correct":"B","explanation":"These detail drawings show the specific placement of sanitary fixtures, tile patterns and accessories within bathroom and toilet spaces."},{"id":339,"theme":"Project Delivery and Contract Administration","question":"A schedule that lists the materials and finishes for walls, floors, and ceilings is the:","options":{"A":"Room Finish Schedule","B":"Material Specification","C":"Finishes Schedule","D":"Interior Design Plan"},"correct":"C","explanation":"A finishes schedule is a tabulated document listing the specified materials and finishes for walls, floors, and ceilings in each room."},{"id":340,"theme":"Project Delivery and Contract Administration","question":"A table providing information about the size, type, and hardware of openings is a:","options":{"A":"Opening Schedule","B":"Fenestration Chart","C":"Doors and Windows Schedule","D":"Glazing Table"},"correct":"C","explanation":"A doors and windows schedule tabulates each opening's size, type, and hardware requirements for procurement and installation."},{"id":341,"theme":"Project Delivery and Contract Administration","question":"Shop drawings are typically prepared by:","options":{"A":"The Architect","B":"The Client","C":"Subcontractors and Suppliers","D":"The Main Contractor"},"correct":"C","explanation":"Shop drawings are typically prepared by subcontractors and suppliers to show how they intend to fabricate and install their specific elements of the work."},{"id":342,"theme":"Project Delivery and Contract Administration","question":"Who is primarily responsible for ensuring that workshop drawings conform to the contract documents?","options":{"A":"The Subcontractor","B":"The Architect","C":"The Main Contractor","D":"The Clerk of Works"},"correct":"B","explanation":"The architect reviews and approves shop drawings to confirm they conform to the design intent and contract documents before work proceeds."},{"id":343,"theme":"Project Delivery and Contract Administration","question":"Warranties for installed equipment are usually provided by:","options":{"A":"The Architect","B":"The Main Contractor","C":"The Client","D":"The Supplier"},"correct":"D","explanation":"Warranties for equipment are usually issued by the manufacturer or supplier, guaranteeing the product's performance and quality."},{"id":344,"theme":"Project Delivery and Contract Administration","question":"What type of document assures the quality and performance of materials or systems?","options":{"A":"Shop Drawing","B":"Invoice","C":"Guarantee","D":"Progress Report"},"correct":"C","explanation":"A guarantee is a formal document assuring that materials or systems will perform as specified for a defined period."},{"id":345,"theme":"Project Delivery and Contract Administration","question":"The architect's review of workshop drawings is primarily to check for:","options":{"A":"Cost-effectiveness","B":"Constructability by all trades","C":"Conformity with the design intent and contract documents","D":"Compliance with safety regulations on site"},"correct":"C","explanation":"The architect's review of shop drawings checks that the contractor's proposed fabrication matches the design intent expressed in the contract documents, not construction means or site safety compliance, which remain the contractor's responsibility."},{"id":346,"theme":"Project Delivery and Contract Administration","question":"An invitation to tender is typically issued by:","options":{"A":"The Contractor","B":"The Architect on behalf of the Client","C":"The Quantity Surveyor","D":"The Project Manager"},"correct":"B","explanation":"The architect, acting as the client's agent, typically issues the invitation to tender to prospective contractors."},{"id":347,"theme":"Project Delivery and Contract Administration","question":"Which document provides detailed descriptions of the materials and workmanship required for the project?","options":{"A":"Bill of Quantities","B":"Form of Tender","C":"Specifications","D":"Contract Drawings"},"correct":"C","explanation":"Specifications are written documents that describe in detail the quality of materials and standard of workmanship required, complementing the drawings."},{"id":348,"theme":"Project Delivery and Contract Administration","question":"The Form of Tender is a document submitted by the contractor that includes:","options":{"A":"Detailed construction methodology","B":"Proposed project schedule","C":"The contractor's quoted price","D":"List of subcontractors"},"correct":"C","explanation":"The Form of Tender is the document a contractor submits stating their quoted price (and agreement to the contract terms) for carrying out the works."},{"id":349,"theme":"Project Delivery and Contract Administration","question":"A meeting held to clarify any ambiguities in the tender documents before bid submission is called a:","options":{"A":"Site Visit","B":"Progress Meeting","C":"Tender Negotiations Meeting","D":"Contract Award Meeting"},"correct":"C","explanation":"A pre-bid clarification meeting (referred to here as a tender negotiations meeting) allows bidders to raise questions and clarify ambiguities in the tender documents before submitting their bids."},{"id":350,"theme":"Project Delivery and Contract Administration","question":"Which tendering procedure involves inviting a select number of pre-qualified contractors to bid?","options":{"A":"Open Tendering","B":"Selective Tendering","C":"Negotiated Tendering","D":"Serial Tendering"},"correct":"B","explanation":"Selective tendering involves inviting only a limited number of pre-qualified, suitably experienced contractors to submit bids, unlike open tendering which is available to all."},{"id":351,"theme":"Project Delivery and Contract Administration","question":"The traditional project delivery method is characterized by:","options":{"A":"A single entity responsible for design and construction","B":"Overlapping design and construction phases","C":"Separate design and construction phases","D":"The client directly managing subcontractors"},"correct":"C","explanation":"In the traditional (design-bid-build) delivery method, design is completed by the architect/engineer before construction begins, with distinct, sequential phases handled by different parties."},{"id":352,"theme":"Project Delivery and Contract Administration","question":"In a Design-and-Build project delivery method, who is typically responsible for both design and construction?","options":{"A":"The Architect","B":"The Client","C":"A single contractor or entity","D":"Multiple prime contractors"},"correct":"C","explanation":"In Design-and-Build, a single entity holds contractual responsibility for both designing and constructing the project, simplifying the client's point of contact."},{"id":353,"theme":"Project Delivery and Contract Administration","question":"The JCT Standard Form of Building Contract with Quantities utilizes which primary document for pricing?","options":{"A":"Schedule of Rates","B":"Bill of Materials","C":"Bill of Quantities","D":"Price List"},"correct":"C","explanation":"The JCT Standard Form of Building Contract with Quantities uses the Bill of Quantities, prepared by the quantity surveyor, as the basis for pricing the works."},{"id":354,"theme":"Project Delivery and Contract Administration","question":"Site Instructions are typically issued by:","options":{"A":"The Contractor","B":"The Clerk of Works","C":"The Architect","D":"The Project Manager"},"correct":"C","explanation":"Site instructions altering or clarifying the works are formally issued by the architect (or contract administrator) under the terms of the building contract."},{"id":355,"theme":"Project Delivery and Contract Administration","question":"Who is primarily responsible for the overall coordination of the design team?","options":{"A":"The Project Manager","B":"The Main Contractor","C":"The Architect","D":"The Clerk of Works"},"correct":"C","explanation":"The architect typically leads and coordinates the design team, integrating the input of various consultants into a cohesive design."},{"id":356,"theme":"Project Delivery and Contract Administration","question":"The Clerk of Works typically acts as the:","options":{"A":"Contractor's representative on site","B":"Architect's on-site representative for quality monitoring","C":"Client's financial advisor","D":"Project Manager's assistant"},"correct":"B","explanation":"The Clerk of Works is appointed to represent the architect's/client's interests on site, monitoring that construction quality and workmanship meet the specified standards."},{"id":357,"theme":"Project Delivery and Contract Administration","question":"The Bureau of Public Procurement (BPP) Act 2007 governs procurement processes for:","options":{"A":"Private Clients","B":"Corporate Organizations","C":"Government Projects","D":"All construction projects in Nigeria"},"correct":"C","explanation":"Nigeria's Bureau of Public Procurement (BPP) Act 2007 establishes procurement rules and standards specifically for public (government) projects and expenditure."},{"id":358,"theme":"Project Delivery and Contract Administration","question":"A written description outlining the quality of materials and workmanship is a:","options":{"A":"Schedule of Works","B":"Method Statement","C":"Specification","D":"Bill of Quantities"},"correct":"C","explanation":"A specification is a written document, separate from the drawings, describing the required quality of materials and standard of workmanship."},{"id":359,"theme":"Project Delivery and Contract Administration","question":"Progress Reports are usually prepared by:","options":{"A":"The Architect","B":"The Client","C":"The Contractor","D":"The Quantity Surveyor"},"correct":"C","explanation":"The contractor typically prepares progress reports to update the design team and client on construction status, work completed, and any issues encountered."},{"id":360,"theme":"Project Delivery and Contract Administration","question":"Minutes of Meetings are a record of discussions and decisions taken during:","options":{"A":"Site Inspections","B":"Progress Meetings","C":"Tender Opening","D":"Handover Procedures"},"correct":"B","explanation":"Minutes of meetings document the discussions, decisions, and action items arising from regular progress meetings held during construction."},{"id":361,"theme":"Project Delivery and Contract Administration","question":"Which of the following is a natural building material?","options":{"A":"Concrete","B":"Steel","C":"Stone","D":"Blockwork"},"correct":"C","explanation":"Stone is a naturally occurring material, whereas concrete, steel, and blockwork are manufactured or processed building materials."},{"id":362,"theme":"Project Delivery and Contract Administration","question":"A composite material made of cement, aggregates, and water is:","options":{"A":"Steel","B":"Timber","C":"Concrete","D":"Ceramics"},"correct":"C","explanation":"Concrete is a composite material formed by mixing cement, aggregates (sand and gravel), and water, which hardens through a chemical curing process."},{"id":363,"theme":"Project Delivery and Contract Administration","question":"Which material is commonly used for structural framing in high-rise buildings?","options":{"A":"Timber","B":"Aluminium","C":"Steel","D":"Blockwork"},"correct":"C","explanation":"Steel's high strength-to-weight ratio and ability to span large distances make it the common choice for structural framing in high-rise construction."},{"id":364,"theme":"Project Delivery and Contract Administration","question":"Hollow concrete blocks are a type of:","options":{"A":"Precast Concrete","B":"Blockwork","C":"Reinforced Concrete","D":"Lightweight Aggregate"},"correct":"B","explanation":"Hollow concrete blocks are a form of blockwork, commonly used for walling in building construction."},{"id":365,"theme":"Project Delivery and Contract Administration","question":"Tiles and sanitary ware are examples of:","options":{"A":"Timber Products","B":"Aluminium Extrusions","C":"Ceramic Materials","D":"Concrete Finishes"},"correct":"C","explanation":"Tiles and sanitary ware (basins, toilets) are typically manufactured from fired ceramic materials."},{"id":366,"theme":"Project Delivery and Contract Administration","question":"Temporary structures used to support concrete during pouring and curing are called:","options":{"A":"Scaffolding","B":"Formwork","C":"Shoring","D":"Bracing"},"correct":"B","explanation":"Formwork is the temporary mould, typically of timber or metal, used to contain and shape concrete while it is poured and cured."},{"id":367,"theme":"Project Delivery and Contract Administration","question":"Excavation and protection are critical activities during:","options":{"A":"Superstructure work","B":"Finishing work","C":"Foundation and Substructure work","D":"Roofing work"},"correct":"C","explanation":"Excavation and protection of the ground are critical early activities in the foundation and substructure phase, before the building's superstructure can begin."},{"id":368,"theme":"Project Delivery and Contract Administration","question":"Retaining walls are designed to resist:","options":{"A":"Wind loads","B":"Seismic forces","C":"Lateral earth pressure","D":"Vertical loads"},"correct":"C","explanation":"Retaining walls are specifically engineered to resist the lateral (horizontal) pressure exerted by retained soil or earth."},{"id":369,"theme":"Project Delivery and Contract Administration","question":"Steel bars embedded in concrete to increase its tensile strength form:","options":{"A":"Pre-stressed Concrete","B":"Post-tensioned Concrete","C":"Reinforced Concrete","D":"Lightweight Concrete"},"correct":"C","explanation":"Reinforced concrete combines concrete's compressive strength with steel reinforcing bars that provide the tensile strength concrete alone lacks."},{"id":370,"theme":"Project Delivery and Contract Administration","question":"Plastering and painting are examples of:","options":{"A":"Structural Elements","B":"Mechanical Services","C":"Finishes in building construction","D":"Electrical Installations"},"correct":"C","explanation":"Plastering and painting are finishing trades that give surfaces their final appearance and protection, distinct from structural, mechanical, or electrical work."},{"id":371,"theme":"Project Delivery and Contract Administration","question":"A formal query raised by the contractor seeking clarification on design details is a:","options":{"A":"Change Order","B":"Progress Claim","C":"Design Query","D":"Site Instruction"},"correct":"C","explanation":"A design query is a formal request from the contractor asking the design team to clarify or resolve an aspect of the design."},{"id":372,"theme":"Project Delivery and Contract Administration","question":"A formal written communication from the contractor to the architect seeking clarification or interpretation of the contract documents is a:","options":{"A":"Variation Order","B":"Request for Information (RFI)","C":"Method Statement","D":"Material Submittal"},"correct":"B","explanation":"An RFI is the standard formal mechanism contractors use to request clarification or interpretation of the contract documents from the architect."},{"id":373,"theme":"Project Delivery and Contract Administration","question":"A systematic process of analyzing the functions of a project to identify opportunities for cost reduction without sacrificing essential performance is:","options":{"A":"Risk Management","B":"Value Engineering","C":"Cost Control","D":"Schedule Optimization"},"correct":"B","explanation":"Value engineering systematically examines a project's functions to find ways to reduce cost while maintaining or improving essential performance and quality."},{"id":374,"theme":"Project Delivery and Contract Administration","question":"Ensuring that the constructed work meets the specified standards and requirements is the aim of:","options":{"A":"Time Management","B":"Cost Management","C":"Quality Control","D":"Resource Allocation"},"correct":"C","explanation":"Quality control is the process aimed at verifying that the completed work conforms to the specified standards and requirements."},{"id":375,"theme":"Project Delivery and Contract Administration","question":"Samples of materials and product data submitted by the contractor for the architect's approval are called:","options":{"A":"Shop Drawings","B":"As-built Drawings","C":"Submittals","D":"Method Statements"},"correct":"C","explanation":"Submittals encompass materials, samples, and product data the contractor provides to the architect for review and approval before use or installation."},{"id":376,"theme":"Project Delivery and Contract Administration","question":"A formal confirmation that a portion of the work has been completed according to the contract is a:","options":{"A":"Completion Certificate","B":"Practical Completion","C":"Certification","D":"Handover Report"},"correct":"C","explanation":"Certification is the architect's formal, documented confirmation that a portion or stage of the work has been satisfactorily completed in accordance with the contract."},{"id":377,"theme":"Project Delivery and Contract Administration","question":"Monitoring and controlling project expenses is the focus of:","options":{"A":"Time Management","B":"Cost Management","C":"Quality Control","D":"Scope Management"},"correct":"B","explanation":"Cost management is the project management function concerned with monitoring, estimating, and controlling project expenditures against the budget."},{"id":378,"theme":"Project Delivery and Contract Administration","question":"Developing and managing the project schedule falls under:","options":{"A":"Resource Management","B":"Time Management","C":"Risk Management","D":"Stakeholder Management"},"correct":"B","explanation":"Time management involves developing, sequencing, and controlling the project schedule to ensure timely completion."},{"id":379,"theme":"Project Delivery and Contract Administration","question":"Establishing clear lines of reporting and interaction among project team members is part of:","options":{"A":"Scope Management","B":"Communication and coordination","C":"Procurement Management","D":"Integration Management"},"correct":"B","explanation":"Establishing clear reporting lines and interaction protocols among team members falls under communication and coordination management."},{"id":380,"theme":"Project Delivery and Contract Administration","question":"A matrix that defines the roles and responsibilities of team members for specific project tasks is a:","options":{"A":"Gantt Chart","B":"Responsibility Matrix","C":"RACI Chart","D":"Work Breakdown Structure"},"correct":"B","explanation":"A responsibility matrix maps project tasks against team members' roles, and is commonly implemented in practice as a RACI (Responsible, Accountable, Consulted, Informed) chart."},{"id":381,"theme":"Project Delivery and Contract Administration","question":"Drawings that show the completed project as it was actually built are:","options":{"A":"Construction Drawings","B":"Shop Drawings","C":"As-built Drawings","D":"Schematic Drawings"},"correct":"C","explanation":"As-built drawings are revised drawings that record the actual, final configuration of the completed project, including any changes made during construction."},{"id":382,"theme":"Project Delivery and Contract Administration","question":"A planned approach for transferring the completed facility to the client is a:","options":{"A":"Commissioning Process","B":"Project Closure","C":"Project Handover Strategy","D":"Final Account Settlement"},"correct":"C","explanation":"A project handover strategy is the planned approach and set of procedures used to formally transfer the completed facility from the contractor to the client."},{"id":383,"theme":"Project Delivery and Contract Administration","question":"Evaluating the performance of a building after occupancy to identify areas for improvement is:","options":{"A":"Snagging Survey","B":"Defects Liability Period","C":"Post Occupancy Evaluation","D":"Building Audit"},"correct":"C","explanation":"A post occupancy evaluation systematically assesses how a building performs once it is in use, identifying lessons and areas for improvement."},{"id":384,"theme":"Project Delivery and Contract Administration","question":"Activities undertaken to keep a building in good repair and working order fall under:","options":{"A":"Facility Management","B":"Building Maintenance","C":"Property Management","D":"Asset Management"},"correct":"B","explanation":"Building maintenance refers specifically to the ongoing activities of repair and upkeep that keep a building in good working order."},{"id":385,"theme":"Project Delivery and Contract Administration","question":"The discipline that integrates people, place, process, and technology to ensure the functionality of the built environment is:","options":{"A":"Construction Management","B":"Project Management","C":"Facility Management","D":"Estate Management"},"correct":"C","explanation":"Facility management is the discipline that integrates people, place, process, and technology to ensure the functionality of the built environment, especially during a building's operational life."}]</script>
<script>
(function(){
  "use strict";

  var QUESTIONS = [];
  try {
    QUESTIONS = JSON.parse(document.getElementById('qdata').textContent);
  } catch (e) {
    QUESTIONS = [];
  }

  var STORE_KEY = 'blueprintDrills.scores.v1';

  function loadScores(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return {};
  }
  function saveScores(s){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e){}
  }

  var scores = loadScores(); // { themeName: {correct: n, attempted: n} }

  function ensureTheme(t){
    if (!scores[t]) scores[t] = {correct:0, attempted:0};
    return scores[t];
  }

  // ---- assign a rotating colour class to each theme, in stable alphabetical order
  var THEME_CLASS = {};
  (function(){
    var names = {};
    QUESTIONS.forEach(function(q){ names[q.theme] = true; });
    var sorted = Object.keys(names).sort();
    sorted.forEach(function(name, i){ THEME_CLASS[name] = 'tag-c' + (i % 9); });
  })();

  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19.5 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CROSS_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';

  // ---- shuffled queue over all question indices, reshuffled (without immediate repeat) when exhausted
  var queue = [];
  var lastServed = -1;

  function shuffledIndices(){
    var idx = QUESTIONS.map(function(_, i){ return i; });
    for (var i = idx.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    return idx;
  }

  function refillQueue(){
    var fresh = shuffledIndices();
    if (fresh.length > 1 && fresh[0] === lastServed){
      var tmp = fresh[0]; fresh[0] = fresh[1]; fresh[1] = tmp;
    }
    queue = fresh;
  }

  function nextIndex(){
    if (queue.length === 0) refillQueue();
    var n = queue.shift();
    lastServed = n;
    return n;
  }

  var current = null;
  var answered = false;

  var qTextEl = document.getElementById('qText');
  var qIndexEl = document.getElementById('qIndex');
  var themeTagEl = document.getElementById('themeTag');
  var optionsEl = document.getElementById('options');
  var explainEl = document.getElementById('explain');
  var explainBodyEl = document.getElementById('explainBody');
  var verdictEl = document.getElementById('verdict');
  var nextBtn = document.getElementById('nextBtn');
  var hsCorrect = document.getElementById('hsCorrect');
  var hsTotal = document.getElementById('hsTotal');

  function totals(){
    var c = 0, a = 0;
    Object.keys(scores).forEach(function(t){
      c += scores[t].correct; a += scores[t].attempted;
    });
    return {c:c, a:a};
  }

  function updateHeader(){
    var t = totals();
    hsCorrect.textContent = t.c;
    hsTotal.textContent = t.a;
  }

  function renderQuestion(){
    var q = QUESTIONS[current];
    answered = false;
    themeTagEl.textContent = q.theme;
    themeTagEl.className = 'theme-tag ' + (THEME_CLASS[q.theme] || 'tag-c0');
    qIndexEl.textContent = 'Q · ' + (q.id + 1);
    qTextEl.textContent = q.question;
    explainEl.classList.remove('show');
    nextBtn.classList.remove('show');
    optionsEl.innerHTML = '';

    ['A','B','C','D'].forEach(function(letter){
      var btn = document.createElement('button');
      btn.className = 'opt';
      btn.type = 'button';
      btn.dataset.letter = letter;
      btn.innerHTML =
        '<span class="opt-letter">' + letter + '</span>' +
        '<span class="opt-text"></span>' +
        '<span class="opt-icon"></span>';
      btn.querySelector('.opt-text').textContent = q.options[letter];
      btn.addEventListener('click', function(){ onAnswer(letter); });
      optionsEl.appendChild(btn);
    });

    var card = document.getElementById('card');
    card.scrollTop = 0;
  }

  function onAnswer(letter){
    if (answered) return;
    answered = true;
    var q = QUESTIONS[current];
    var correctLetter = q.correct;
    var isRight = letter === correctLetter;

    var buttons = optionsEl.querySelectorAll('.opt');
    buttons.forEach(function(btn){
      btn.disabled = true;
      var l = btn.dataset.letter;
      if (l === correctLetter){
        btn.classList.add('correct');
        btn.querySelector('.opt-icon').innerHTML = CHECK_SVG;
      } else if (l === letter){
        btn.classList.add('wrong');
        btn.querySelector('.opt-icon').innerHTML = CROSS_SVG;
      }
    });

    verdictEl.className = 'verdict ' + (isRight ? 'good' : 'bad');
    verdictEl.innerHTML = (isRight ? CHECK_SVG : CROSS_SVG) + (isRight ? 'Nailed it' : 'Not quite');
    explainBodyEl.textContent = q.explanation;
    explainEl.classList.add('show');
    nextBtn.classList.add('show');

    var rec = ensureTheme(q.theme);
    rec.attempted += 1;
    if (isRight) rec.correct += 1;
    saveScores(scores);
    updateHeader();
  }

  function advance(){
    current = nextIndex();
    renderQuestion();
  }

  nextBtn.addEventListener('click', advance);

  // ---- Drawer
  var backdrop = document.getElementById('backdrop');
  var drawer = document.getElementById('drawer');
  var themeList = document.getElementById('themeList');
  var overallFrac = document.getElementById('overallFrac');
  var resetBtn = document.getElementById('resetBtn');
  var resetArmed = false;

  function renderDrawer(){
    var t = totals();
    overallFrac.textContent = t.c + ' / ' + t.a;

    var themeNames = {};
    QUESTIONS.forEach(function(q){ themeNames[q.theme] = true; });
    var names = Object.keys(themeNames).sort();

    themeList.innerHTML = '';
    names.forEach(function(name){
      var rec = scores[name] || {correct:0, attempted:0};
      var pct = rec.attempted ? Math.round((rec.correct / rec.attempted) * 100) : 0;
      var row = document.createElement('div');
      row.className = 'theme-row';
      row.innerHTML =
        '<div class="theme-row-top">' +
          '<span class="theme-name"></span>' +
          '<span class="theme-frac mono"></span>' +
        '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
      row.querySelector('.theme-name').textContent = name;
      row.querySelector('.theme-frac').textContent = rec.correct + ' / ' + rec.attempted;
      themeList.appendChild(row);
    });
  }

  function openDrawer(){
    renderDrawer();
    backdrop.classList.add('show');
    drawer.classList.add('show');
  }
  function closeDrawer(){
    backdrop.classList.remove('show');
    drawer.classList.remove('show');
    resetArmed = false;
    resetBtn.classList.remove('armed');
    resetBtn.textContent = 'Reset all progress';
  }

  document.getElementById('openDrawer').addEventListener('click', openDrawer);
  document.getElementById('headerStat').addEventListener('click', openDrawer);
  document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);

  resetBtn.addEventListener('click', function(){
    if (!resetArmed){
      resetArmed = true;
      resetBtn.classList.add('armed');
      resetBtn.textContent = 'Tap again to confirm';
      return;
    }
    scores = {};
    saveScores(scores);
    updateHeader();
    renderDrawer();
    resetArmed = false;
    resetBtn.classList.remove('armed');
    resetBtn.textContent = 'Reset all progress';
  });

  // ---- boot
  function start(){
    if (!QUESTIONS.length){
      qTextEl.textContent = 'No questions loaded.';
      return;
    }
    updateHeader();
    advance();
  }

  if (window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(start) : start();
  } else {
    start();
  }
})();
</script>

</body>
</html>
