":"Designing buildings that ignore local building codes"},"correct":"A","explanation":"Contextualism ensures a building's design harmonizes with local landscapes and cultural elements."},{"id":123,"theme":"History and Theory of Architecture","question":"What is the concept of deconstructivism in architecture?","options":{"A":"Designing buildings that challenge traditional architectural conventions with fragmented forms","B":"Designing buildings that strictly follow classical symmetry","C":"Designing buildings using only vernacular materials","D":"Designing buildings with minimal structural complexity"},"correct":"A","explanation":"Deconstructivist designs feature fragmented forms and unconventional layouts that challenge traditional conventions."},{"id":124,"theme":"History and Theory of Architecture","question":"What is the concept of postmodernism in architecture?","options":{"A":"Designing buildings that incorporate historical references and eclectic styles","B":"Designing buildings with strictly minimalist, undecorated facades","C":"Designing buildings using only glass curtain walls","D":"Designing buildings that avoid any historical influence"},"correct":"A","explanation":"Postmodern architecture blends classical elements with modern innovations, incorporating historical references and eclectic styles."},{"id":125,"theme":"History and Theory of Architecture","question":"What is Impluvium architecture?","options":{"A":"A traditional Roman design featuring a central courtyard with an opening to collect rainwater","B":"A modern Nigerian construction technique using rammed earth","C":"A Gothic architectural style featuring flying buttresses","D":"A Japanese design principle emphasizing minimal ornamentation"},"correct":"A","explanation":"Impluvium architecture refers to a traditional Roman design with a central courtyard that includes an opening for collecting rainwater for storage."},{"id":126,"theme":"History and Theory of Architecture","question":"How is the International Style typically reflected in Nigerian university architecture?","options":{"A":"Through functional, minimalist designs influenced by global modernist principles","B":"Through heavily ornamented, colonial-era facades","C":"Through exclusively traditional vernacular building methods","D":"Through the use of only local, non-standardized materials"},"correct":"A","explanation":"The International Style in Nigerian universities incorporates functional and minimalist designs, prioritizing clean lines, simple forms, and open spaces influenced by global modernist principles."},{"id":127,"theme":"History and Theory of Architecture","question":"Who designed the Abuja Master Plan?","options":{"A":"Japanese architect Kenzo Tange and International Planning Associates (IPA)","B":"French architect Le Corbusier","C":"American architect Frank Lloyd Wright","D":"British-Ghanaian architect David Adjaye"},"correct":"A","explanation":"The Abuja Master Plan was designed by Japanese architect Kenzo Tange together with International Planning Associates (IPA)."},{"id":128,"theme":"History and Theory of Architecture","question":"The National Arts Theatre in Lagos, built in 1976, is known for what distinctive architectural feature?","options":{"A":"A design inspired by military headgear","B":"A design inspired by a traditional Yoruba crown","C":"A facade made entirely of reclaimed timber","D":"An underground amphitheater with no visible superstructure"},"correct":"A","explanation":"The National Arts Theatre is a cultural landmark built in 1976, known for its distinctive design inspired by military headgear."},{"id":129,"theme":"History and Theory of Architecture","question":"What is currently the tallest building in Nigeria?","options":{"A":"NECOM House, Lagos","B":"Cocoa House, Ibadan","C":"Eko Atlantic Tower, Lagos","D":"Nigerian Stock Exchange Building, Lagos"},"correct":"A","explanation":"NECOM House in Lagos is Nigeria's tallest building, standing at 32 floors."},{"id":130,"theme":"History and Theory of Architecture","question":"Which architect designed Fallingwater and the Guggenheim Museum?","options":{"A":"Frank Lloyd Wright","B":"Le Corbusier","C":"Zaha Hadid","D":"David Adjaye"},"correct":"A","explanation":"Frank Lloyd Wright is known for designing Fallingwater and the Guggenheim Museum."},{"id":131,"theme":"History and Theory of Architecture","question":"Which architect is known for Villa Savoye and the Chandigarh city planning project?","options":{"A":"Frank Lloyd Wright","B":"Le Corbusier","C":"Zaha Hadid","D":"Kenzo Tange"},"correct":"B","explanation":"Le Corbusier designed Villa Savoye and contributed to the master planning of Chandigarh."},{"id":132,"theme":"History and Theory of Architecture","question":"Which architect designed the Heydar Aliyev Center?","options":{"A":"Zaha Hadid","B":"David Adjaye","C":"Frank Lloyd Wright","D":"Le Corbusier"},"correct":"A","explanation":"Zaha Hadid designed the Heydar Aliyev Center, known for its fluid, curvilinear form."},{"id":133,"theme":"History and Theory of Architecture","question":"Which architect designed the National Museum of African American History and Culture?","options":{"A":"David Adjaye","B":"Frank Lloyd Wright","C":"Kenzo Tange","D":"Zaha Hadid"},"correct":"A","explanation":"David Adjaye designed the National Museum of African American History and Culture in Washington, D.C."},{"id":134,"theme":"History and Theory of Architecture","question":"Which architect designed the Tokyo Metropolitan Government Building?","options":{"A":"Kenzo Tange","B":"Frank Lloyd Wright","C":"Le Corbusier","D":"Zaha Hadid"},"correct":"A","explanation":"Kenzo Tange designed the Tokyo Metropolitan Government Building."},{"id":135,"theme":"Urban and Site Planning","question":"What is the purpose of a zoning ordinance in architectural design?","options":{"A":"To regulate the use and development of land within a specific area","B":"To determine a building's interior finishes","C":"To set an architect's professional fee scale","D":"To calculate a building's structural loads"},"correct":"A","explanation":"Zoning ordinances guide land use and define construction limits within a specific area."},{"id":136,"theme":"Urban and Site Planning","question":"What is the purpose of conducting a site analysis in architectural design?","options":{"A":"To determine the client's construction budget","B":"To analyze the site's topography and climate","C":"To select the building's interior furnishings","D":"To calculate the architect's professional fee"},"correct":"B","explanation":"A site analysis helps architects understand environmental factors, such as topography and climate, that impact design decisions."},{"id":137,"theme":"Urban and Site Planning","question":"What is the purpose of a site plan in architectural design?","options":{"A":"To illustrate the building's structural framing","B":"To showcase the building's landscaping, access points, and surrounding environment","C":"To list a project's bill of quantities","D":"To detail a building's electrical wiring"},"correct":"B","explanation":"A site plan illustrates the surrounding environment, access points, and outdoor spaces of a project."},{"id":138,"theme":"Urban and Site Planning","question":"What is the role of an architect in urban planning?","options":{"A":"Creating master plans for entire neighborhoods or cities","B":"Setting national housing subsidy rates","C":"Managing a city's public transportation schedules","D":"Collecting property taxes"},"correct":"A","explanation":"Architects help design large-scale developments in urban planning, ensuring functionality and sustainability at a neighborhood or city scale."},{"id":139,"theme":"History and Theory of Architecture","question":"Which of the following architects is renowned for the flying spiral staircase in Florence?","options":{"A":"Le Corbusier","B":"Walter Gropius","C":"Pier Luigi Nervi","D":"Louis Sullivan"},"correct":"C","explanation":"According to the source, Pier Luigi Nervi is credited with the renowned flying (cantilevered) spiral staircase in Florence."},{"id":140,"theme":"Project Delivery and Contract Administration","question":"Which of the following services is NOT performed by the architect under the design-build service by administration?","options":{"A":"Prepares schedule of work, construction program, construction estimate, bill of materials, etc.","B":"Advances funding for payment of expenditures connected with the work","C":"Keeps records and books of accounts","D":"Appoints construction superintendent, purchasing agent, timekeeper, property clerks, etc."},"correct":"B","explanation":"Under design-build by administration, the architect administers and documents the work but does not personally advance funds to cover project expenditures; that financial responsibility remains with the owner."},{"id":141,"theme":"Project Delivery and Contract Administration","question":"In the bill of quantities, which of the following does NOT belong to the project particulars?","options":{"A":"Principal consultant","B":"Title of the project or scheme","C":"Location","D":"Contract sum"},"correct":"A","explanation":"Project particulars in a bill of quantities preliminaries typically list the project title, location, and contract sum, but not the individual name of the principal consultant."},{"id":142,"theme":"Structures and Building Technology","question":"An existing two-story hospital is adding more patient beds. When preparing an analysis to determine whether to expand vertically or horizontally, which of the following should be done first?","options":{"A":"Evaluate potential disruptions","B":"Confirm the existing structural capacity","C":"Determine exiting requirements","D":"Analyze sharing of utility services"},"correct":"B","explanation":"Before deciding whether to add floors (vertical) or extend the footprint (horizontal), the existing structure's load-bearing capacity must be confirmed, since it determines whether vertical expansion is even feasible."},{"id":143,"theme":"Project Delivery and Contract Administration","question":"A method of compensation that represents a risk situation to the architect since his costs may exceed the agreed amount?","options":{"A":"Multiple of direct personnel expense","B":"Percentage of construction cost","C":"Professional fee plus expenses","D":"Lump sum or fixed fee"},"correct":"D","explanation":"A lump sum or fixed fee is agreed upon in advance regardless of the architect's actual costs, so if expenses exceed the fee, the architect absorbs the shortfall."},{"id":144,"theme":"Urban and Site Planning","question":"What is the purpose of a master plan?","options":{"A":"The actualization of the original technical details on ground according to specifications","B":"To organize the pattern of land use and development guidelines","C":"To enforce daily construction site safety protocols","D":"To determine the structural specifications of individual buildings"},"correct":"B","explanation":"A master plan is a strategic document that organizes land-use patterns and sets development guidelines for an area, rather than dealing with site safety or individual building structural details."},{"id":145,"theme":"Project Delivery and Contract Administration","question":"Who signs the site taking-over certificate?","options":{"A":"Architect","B":"Builder","C":"Contractor","D":"QS (Quantity Surveyor)"},"correct":"A","explanation":"The site (practical completion / taking-over) certificate is issued and signed by the architect, certifying that the works have reached the stage where the client can take possession."},{"id":146,"theme":"Project Delivery and Contract Administration","question":"An architect suggested to the client that a blank wall in one portion of the lobby be provided with a mural painting. The client agreed and asked the architect to present a design for the mural painting. The architect hired a popular painter to make the concept design. Who will pay for the services of the mural painter?","options":{"A":"Already included in the fees of the architect","B":"Client","C":"To be decided by arbitration","D":"Architect"},"correct":"B","explanation":"Since the mural painting is an additional scope the client requested and approved, the client, not the architect, bears the cost of the painter's services."},{"id":147,"theme":"Project Delivery and Contract Administration","question":"The certificate issued by the code enforcement officer, which permits the use of a building in accordance with the provisions of law for the use and occupancy of the building in its several parts together with any special stipulations or conditions of the building permit.","options":{"A":"Certificate of use and habitation","B":"Certificate of occupancy","C":"Certificate of partial completion","D":"Building permit"},"correct":"B","explanation":"A certificate of occupancy is issued by the code enforcement officer to confirm a building may legally be used and occupied under applicable codes and permit conditions."},{"id":148,"theme":"Professionalism and Ethics","question":"Which is an unethical action with respect to the architect's responsibility to his client?","options":{"A":"Undertakes construction for a fixed contract sum under design-build services","B":"Does not offer preliminary sketches without an agreement","C":"Advises client to forgo an unviable project","D":"Guarantees any estimate or cost of work"},"correct":"D","explanation":"Architects are not permitted to guarantee cost estimates, since actual construction costs depend on factors outside their control; doing so is considered unethical conduct toward the client."},{"id":149,"theme":"Professionalism and Ethics","question":"How many members make up the ARCON executive council?","options":{"A":"36","B":"48","C":"24","D":"32"},"correct":"B","explanation":"Per the source, the ARCON (Architects Registration Council of Nigeria) Executive Council is made up of 48 members."},{"id":150,"theme":"Project Delivery and Contract Administration","question":"Building and equipment maintenance is one of the architect's services that falls under:","options":{"A":"Post-construction services","B":"Pre-construction services","C":"Construction services","D":"Design-build services"},"correct":"A","explanation":"Building and equipment maintenance occurs after the building is completed and occupied, placing it under the architect's post-construction services."},{"id":151,"theme":"Professionalism and Ethics","question":"If there are two architects on a certain project, the architect-of-record and the architect-in-charge of construction, and the building collapses, who is more liable?","options":{"A":"It depends on the investigation","B":"Architect-of-record","C":"Both are liable","D":"Architect in charge of construction"},"correct":"B","explanation":"The architect-of-record holds overall professional responsibility for the project and is therefore considered more liable than the architect merely in charge of construction supervision."},{"id":152,"theme":"Pre-Design Planning and Practice Management","question":"Where does physical planning services fall?","options":{"A":"Design and planning services","B":"Regular design services","C":"Pre-design services","D":"Specialized allied services"},"correct":"C","explanation":"Physical planning services are carried out before the design stages begin, so they fall under pre-design services."},{"id":153,"theme":"Pre-Design Planning and Practice Management","question":"Who is responsible for the soil investigation of the project?","options":{"A":"Construction manager","B":"Owner","C":"Project manager","D":"Contractor"},"correct":"B","explanation":"The owner is responsible for commissioning and paying for the soil investigation, as it is a pre-design due-diligence cost borne by the client."},{"id":154,"theme":"Professionalism and Ethics","question":"After successfully completing a 500-unit affordable housing development scheme, the architect decides to advertise his work to earn more clients. Which of the mediums listed below is most appropriate?","options":{"A":"National newspaper","B":"Electronic bill board","C":"Private property magazine","D":"Public property magazine"},"correct":"C","explanation":"A private property magazine targets the specific audience of prospective housing clients and developers, making it the most appropriate professional medium among the options for advertising the architect's completed work."},{"id":155,"theme":"Professionalism and Ethics","question":"What offense is committed when an architect is found using the seal of another architect?","options":{"A":"Misrepresentation","B":"Misdemeanor","C":"Nothing","D":"Illegal practice"},"correct":"D","explanation":"Using another architect's professional seal without authorization constitutes illegal practice, since the seal certifies that a specific licensed individual takes responsibility for the work."},{"id":156,"theme":"Project Delivery and Contract Administration","question":"Who gives the directive to start the project?","options":{"A":"Architect","B":"Project manager","C":"Owner","D":"Construction manager"},"correct":"C","explanation":"As the party funding and commissioning the project, the owner gives the directive authorizing the project to begin."},{"id":157,"theme":"Project Delivery and Contract Administration","question":"A written communication issued by an owner authorizing a contractor to proceed with the work and establishing the date of commencement of the work.","options":{"A":"Contract","B":"Bidding","C":"Notice to proceed","D":"Award"},"correct":"C","explanation":"A notice to proceed is the formal written communication from the owner authorizing the contractor to begin work and establishing the official commencement date."},{"id":158,"theme":"Project Delivery and Contract Administration","question":"A specification that stipulates the exact quantities and qualities of materials to be furnished.","options":{"A":"Performance specs","B":"Reference specs","C":"Descriptive specs","D":"Propriety specs"},"correct":"C","explanation":"Descriptive specifications state the exact quantities, qualities, and composition of materials to be furnished, unlike performance specs (which state required outcomes) or proprietary specs (which name specific products)."},{"id":159,"theme":"Project Delivery and Contract Administration","question":"The construction drawings and specifications setting forth in detail the requirements for the construction of a project.","options":{"A":"Contract docs","B":"Specifications","C":"Construction docs","D":"Construction drawings"},"correct":"C","explanation":"Construction documents are the detailed drawings and specifications that set forth, in full detail, the requirements for constructing the project."},{"id":160,"theme":"Pre-Design Planning and Practice Management","question":"The third phase of an architect's regular services.","options":{"A":"Contract documents phase","B":"Final design phase","C":"Schematic design phase","D":"Bidding phase"},"correct":"B","explanation":"Per the source's sequencing of an architect's regular services, the final design phase is identified as the third phase."},{"id":161,"theme":"Project Delivery and Contract Administration","question":"An outline specification enumerating the type and trade names of materials to be used.","options":{"A":"Closed specification","B":"Schedule of material and finishes","C":"Descriptive specification","D":"Performance specification"},"correct":"B","explanation":"A schedule of materials and finishes is an outline specification that lists the type and trade names of the materials to be used in a project."},{"id":162,"theme":"Project Delivery and Contract Administration","question":"A bond furnished by the contractor and his surety as a guarantee to execute the work.","options":{"A":"Performance bond","B":"Guarantee bond","C":"Bid bond","D":"Payment bond"},"correct":"A","explanation":"A performance bond is furnished by the contractor and their surety to guarantee that the work will be executed in accordance with the contract."},{"id":163,"theme":"Professionalism and Ethics","question":"A statute specifying the period of time within which legal action must be brought.","options":{"A":"Statute of limitation","B":"Statute of frauds","C":"Statute of repose","D":"Mechanic's lien law"},"correct":"A","explanation":"A statute of limitation specifies the fixed period within which a legal action must be initiated, after which the claim is barred."},{"id":164,"theme":"Project Delivery and Contract Administration","question":"Instructions which may be issued prior to the bidding to supplement and/or modify drawings, specifications, and/or general conditions of the contract.","options":{"A":"Special provisions","B":"General conditions","C":"Addenda","D":"Change order"},"correct":"A","explanation":"Per the source, special provisions are the instructions issued prior to bidding to supplement or modify the drawings, specifications, or general conditions of the contract."},{"id":165,"theme":"Design and Construction","question":"In architecture, what word describes a furious effort to complete a project within a certain time?","options":{"A":"Charette","B":"Trabeation","C":"Fenestration","D":"Archispeak"},"correct":"A","explanation":"A charette is an intensive, often collaborative, burst of effort to complete a design project within a tight deadline."},{"id":166,"theme":"History and Theory of Architecture","question":"Which of the following is one of the seven wonders of the ancient world?","options":{"A":"The Great Pyramid of Giza","B":"The Empire State Building","C":"The Eiffel Tower","D":"Niagara Falls"},"correct":"A","explanation":"The Great Pyramid of Giza is the only structure listed among the traditional Seven Wonders of the Ancient World."},{"id":167,"theme":"Design and Construction","question":"Which of the following is typically used in stone carving?","options":{"A":"Brush, hammer","B":"Chisel, palette","C":"Hammer, easel","D":"Hammer, chisel"},"correct":"D","explanation":"A hammer and chisel are the classic tools used to carve and shape stone."},{"id":168,"theme":"Design and Construction","question":"Which of these is not a term for a room in a house?","options":{"A":"Foyer","B":"Study","C":"Mausoleum","D":"Parlor"},"correct":"C","explanation":"A mausoleum is a freestanding burial structure, not a room within a house, unlike a foyer, study, or parlor."},{"id":169,"theme":"History and Theory of Architecture","question":"What art museum added a glass pyramid to its building in 1989?","options":{"A":"The Metropolitan Museum of Art","B":"The Rijksmuseum","C":"The Louvre","D":"The Tate Gallery"},"correct":"C","explanation":"The Louvre added I.M. Pei's glass pyramid to its courtyard in 1989."},{"id":170,"theme":"Sustainability and Environment","question":"What is the name for spherical, energy-efficient buildings?","options":{"A":"Solar circles","B":"Green globes","C":"Greenhouses","D":"Geodesic domes"},"correct":"D","explanation":"Geodesic domes are spherical structures noted for their structural efficiency and energy performance."},{"id":171,"theme":"History and Theory of Architecture","question":"Where is the famous Egyptian Great Pyramid?","options":{"A":"Luxor","B":"Giza","C":"Alexandria","D":"Rosetta"},"correct":"B","explanation":"The Great Pyramid, built for Khufu, is located on the Giza plateau in Egypt."},{"id":172,"theme":"History and Theory of Architecture","question":"Which US president designed his own house, Monticello?","options":{"A":"Chester Arthur","B":"Thomas Jefferson","C":"Theodore Roosevelt","D":"Jimmy Carter"},"correct":"B","explanation":"Thomas Jefferson designed his own home, Monticello, in Virginia."},{"id":173,"theme":"Structures and Building Technology","question":"What are bricks usually made of?","options":{"A":"Clay","B":"Flour","C":"Rocks","D":"Sand"},"correct":"A","explanation":"Bricks are traditionally manufactured from molded and fired clay."},{"id":174,"theme":"Design and Construction","question":"What is the name for a store with at least 100,000 square feet of retail space?","options":{"A":"Specialty store","B":"Big box store","C":"Department store","D":"Club store"},"correct":"B","explanation":"A 'big box store' is the retail term for a large-format store, typically defined as having at least 100,000 square feet of retail space."},{"id":175,"theme":"Design and Construction","question":"What is a garret?","options":{"A":"A roof","B":"A window","C":"An attic","D":"A basement"},"correct":"C","explanation":"A garret is the traditional term for an attic room, usually located directly under a sloped roof."},{"id":176,"theme":"Design and Construction","question":"What is the name for the spinning device atop a building that shows the wind's direction?","options":{"A":"Wind compass","B":"Lightning rod","C":"Weather vane","D":"Rooster mobile"},"correct":"C","explanation":"A weather vane is the rotating device mounted atop a building that indicates wind direction."},{"id":177,"theme":"Design and Construction","question":"What is the name for a roof shaped like half of a ball, which is often used in capitol buildings?","options":{"A":"Manse","B":"Peak","C":"Dome","D":"Tier"},"correct":"C","explanation":"A dome is a hemispherical (half-ball-shaped) roof form commonly used on capitol and government buildings."},{"id":178,"theme":"History and Theory of Architecture","question":"What type of building is the Chateau de Versailles?","options":{"A":"A ski cabin","B":"A palace","C":"A skyscraper","D":"A bunker"},"correct":"B","explanation":"The Chateau de Versailles was built as a royal palace for the French monarchy."},{"id":179,"theme":"Design and Construction","question":"What is the name for a separate living space attached to a house?","options":{"A":"Sister quarters","B":"Mother-in-law quarters","C":"Nephew quarters","D":"Grandfather quarters"},"correct":"B","explanation":"'Mother-in-law quarters' is the common term for a separate, self-contained living space attached to or on the same property as a main house."},{"id":180,"theme":"Design and Construction","question":"Architecture involves the following processes, except?","options":{"A":"Planning","B":"Designing","C":"Structuring","D":"Building"},"correct":"C","explanation":"Architecture is typically described as involving planning, designing, and building, while 'structuring' is not one of the standard processes attributed to it."},{"id":181,"theme":"History and Theory of Architecture","question":"The work of an architect can be perceived as?","options":{"A":"Works of science","B":"Works of art","C":"Works of the wood","D":"Works of psychology"},"correct":"B","explanation":"Architecture is traditionally regarded as a work of art, blending aesthetic, functional, and technical considerations."},{"id":182,"theme":"History and Theory of Architecture","question":"The surviving written book on architecture, De Architectura, was written by?","options":{"A":"Da Vinci","B":"Marcus Vitruvius Pollio","C":"Pablo Picasso","D":"Marcus Pollock"},"correct":"B","explanation":"De Architectura, the oldest surviving major work on architectural theory, was written by the Roman architect and engineer Marcus Vitruvius Pollio."},{"id":183,"theme":"History and Theory of Architecture","question":"Who was called the father of skyscrapers?","options":{"A":"Mohenjo Daro","B":"Louis Henry Sullivan","C":"Vincent van Gogh","D":"Vitruvius"},"correct":"B","explanation":"Louis Henry Sullivan is widely known as the 'father of skyscrapers' for his pioneering work on tall steel-frame buildings."},{"id":184,"theme":"History and Theory of Architecture","question":"What is the study of assumptions, foundation, and implications of design?","options":{"A":"Philosophy of assumption","B":"Philosophy of art","C":"Design architecture","D":"Philosophy of design"},"correct":"D","explanation":"Philosophy of design is the field that studies the assumptions, foundations, and implications of design."},{"id":185,"theme":"History and Theory of Architecture","question":"A blueprint of the enterprise that provides a common understanding of the organization and is used to align strategic objectives and tactical demands, is called?","options":{"A":"Business architecture","B":"Mind architecture","C":"Science architecture","D":"Art architecture"},"correct":"A","explanation":"Business architecture is the discipline that provides a blueprint of an enterprise, aligning its strategic objectives with tactical operations."},{"id":186,"theme":"History and Theory of Architecture","question":"In architecture, the theory that tells about the structure of the human mind is known as?","options":{"A":"Business architecture","B":"Mind architecture","C":"Cognitive architecture","D":"Art regards"},"correct":"C","explanation":"Cognitive architecture is the theory describing the underlying structure of the human mind."},{"id":187,"theme":"Design and Construction","question":"What is a sharp edge where two surfaces meet at an angle, such as the corner of a square column or shaft?","options":{"A":"Arrays","B":"Arris","C":"Roof","D":"Aerial"},"correct":"B","explanation":"An arris is the sharp edge formed where two surfaces meet at an angle, such as the corner of a square column or shaft."},{"id":188,"theme":"Design and Construction","question":"A gambrel, which is a symmetrical roof with two slopes on each side, is always","options":{"A":"Two sided","B":"One sided","C":"Three sided","D":"Four sided"},"correct":"A","explanation":"A gambrel roof is symmetrical with two slopes on each side, making it a two-sided roof form."},{"id":189,"theme":"History and Theory of Architecture","question":"Tracery is the stonework elements that support the glass in a?","options":{"A":"Door window","B":"Window","C":"Gothic window","D":"Roof window"},"correct":"C","explanation":"Tracery refers to the ornamental stonework that supports and divides the glass panes in a Gothic window."},{"id":190,"theme":"History and Theory of Architecture","question":"How many stories tall is the Sears Tower?","options":{"A":"88","B":"102","C":"110","D":"135"},"correct":"C","explanation":"The Sears (Willis) Tower in Chicago is 110 stories tall."},{"id":191,"theme":"History and Theory of Architecture","question":"Where was the Statue of Liberty constructed?","options":{"A":"Boston","B":"Paris","C":"London","D":"New York City"},"correct":"B","explanation":"The Statue of Liberty was constructed in France, in Paris, before being shipped to and assembled in New York."},{"id":192,"theme":"History and Theory of Architecture","question":"Where is the Sears Tower located?","options":{"A":"Chicago","B":"Milwaukee","C":"Detroit","D":"Tokyo"},"correct":"A","explanation":"The Sears (Willis) Tower is located in Chicago, Illinois."},{"id":193,"theme":"Professionalism and Ethics","question":"What does an architect do?","options":{"A":"Design websites","B":"Design automobiles","C":"Design clothing","D":"Design buildings"},"correct":"D","explanation":"An architect's core professional role is to design buildings."},{"id":194,"theme":"Structures and Building Technology","question":"Which is the name of an adhesive material used in construction, made of cement, sand and water?","options":{"A":"Mortar","B":"Glue","C":"Nails","D":"Screws"},"correct":"A","explanation":"Mortar, made from cement, sand, and water, is the traditional adhesive material used to bind masonry units together."},{"id":195,"theme":"History and Theory of Architecture","question":"The Egyptian pyramids were used for what?","options":{"A":"Tombs","B":"Bathrooms","C":"Houses","D":"Marketplaces"},"correct":"A","explanation":"The Egyptian pyramids were built as tombs for pharaohs and their burial goods."},{"id":196,"theme":"Design and Construction","question":"What is a verandah?","options":{"A":"A living room","B":"A roof","C":"A door","D":"A porch"},"correct":"D","explanation":"A verandah is a roofed, open-sided porch or gallery attached to the exterior of a building."},{"id":197,"theme":"History and Theory of Architecture","question":"What is the Egyptian structure with the head of a pharaoh and the body of a lion?","options":{"A":"Pegasus","B":"Matador","C":"Phoenix","D":"Sphinx"},"correct":"D","explanation":"The Sphinx is the Egyptian structure with the head of a pharaoh and the body of a lion."},{"id":198,"theme":"History and Theory of Architecture","question":"Which type of building is the John Hancock building in Chicago?","options":{"A":"A two-story museum","B":"A barn","C":"A skyscraper","D":"A Victorian home"},"correct":"C","explanation":"The John Hancock Center in Chicago is a landmark skyscraper."},{"id":199,"theme":"Design and Construction","question":"What is the name for a very large house?","options":{"A":"Wendy house","B":"Pied a terre","C":"Mansion","D":"Brownstone"},"correct":"C","explanation":"A mansion is the term for a very large, imposing house."},{"id":200,"theme":"Structures and Building Technology","question":"What is another name for a bricklayer?","options":{"A":"Bonder","B":"Architect","C":"Breaker","D":"Mason"},"correct":"D","explanation":"A mason is another name for a bricklayer, a tradesperson who builds structures from brick or stone."},{"id":201,"theme":"Design and Construction","question":"What is the name for a tower on a farm where grain and corn are stored?","options":{"A":"Silo","B":"Farmhouse","C":"Barn","D":"Cell tower"},"correct":"A","explanation":"A silo is a tower structure used on farms to store grain and corn."},{"id":202,"theme":"Design and Construction","question":"Which drafting tool is used to draw circles?","options":{"A":"A compass","B":"A round","C":"A spiral","D":"A circulator"},"correct":"A","explanation":"A compass is the drafting tool used to draw circles and arcs."},{"id":203,"theme":"Design and Construction","question":"On which part of a building are you most likely to find linoleum?","options":{"A":"The walls","B":"The floor","C":"The doors","D":"The ceiling"},"correct":"B","explanation":"Linoleum is a resilient flooring material, so it is most likely found on the floor."},{"id":204,"theme":"History and Theory of Architecture","question":"From which empire did Romanesque architecture borrow its style?","options":{"A":"British","B":"Roman","C":"Byzantine","D":"Greek"},"correct":"B","explanation":"Romanesque architecture derived its rounded arches, thick walls, and massing from Roman architectural precedents."},{"id":205,"theme":"Design and Construction","question":"What is the name of the theater platform where a performance takes place?","options":{"A":"Story","B":"Stage","C":"Box","D":"Screen"},"correct":"B","explanation":"The stage is the platform in a theater where a performance takes place."},{"id":206,"theme":"Design and Construction","question":"What is the name for a building that houses members of the military?","options":{"A":"Bivouac","B":"Barracks","C":"Yurt","D":"Pontoons"},"correct":"B","explanation":"Barracks are buildings constructed to house members of the military."},{"id":207,"theme":"Design and Construction","question":"What is the name of a glass building used for growing plants?","options":{"A":"Crystal cottage","B":"Scullery","C":"Greenhouse","D":"Ranch house"},"correct":"C","explanation":"A greenhouse is a glass building designed for growing plants under controlled conditions."},{"id":208,"theme":"Professionalism and Ethics","question":"A person who designs and supervises the construction of buildings or other large structures.","options":{"A":"Civil Engineer","B":"Architect","C":"Realtor","D":"Carpenter"},"correct":"B","explanation":"An architect is the professional who designs buildings and supervises the construction of buildings or other large structures."},{"id":209,"theme":"Design and Construction","question":"To plan, create, or devise; may refer to the results of the planning, creating, and devising.","options":{"A":"Layout","B":"Sketch","C":"Building plan","D":"Design"},"correct":"D","explanation":"'Design' refers both to the act of planning, creating, or devising something, and to the resulting plan or object itself."},{"id":210,"theme":"Professionalism and Ethics","question":"A person whose business is selling and leasing property.","options":{"A":"Realtor","B":"Architect","C":"Civil Engineer","D":"Contractor"},"correct":"A","explanation":"A realtor is a licensed professional whose business is selling and leasing real property."},{"id":211,"theme":"Design and Construction","question":"Orthographic drawings that show one side of a building's interior or exterior.","options":{"A":"Elevations","B":"Floor Plans","C":"Roof Plans","D":"Section Views"},"correct":"A","explanation":"Elevations are orthographic drawings that show one side (interior or exterior) of a building."},{"id":212,"theme":"Professionalism and Ethics","question":"A person who employs another professionally; a customer.","options":{"A":"Architect","B":"Client","C":"Realtor","D":"Regulator"},"correct":"B","explanation":"A client is the person who employs another (such as an architect) professionally and is, in effect, the customer."},{"id":213,"theme":"Professionalism and Ethics","question":"A person legally appointed by another to act as his or her agent in the transaction of business, specifically one qualified and licensed to act for plaintiffs and defendants in legal proceedings.","options":{"A":"Lawyer","B":"Designer","C":"Architect","D":"Civil Engineer"},"correct":"A","explanation":"A lawyer is a person legally appointed and licensed to act as an agent for plaintiffs and defendants in legal proceedings."},{"id":214,"theme":"Urban and Site Planning","question":"A body of people in the same locality.","options":{"A":"Contractor","B":"Culture","C":"Community","D":"Locale"},"correct":"C","explanation":"A community is defined as a body of people living in the same locality."},{"id":215,"theme":"Professionalism and Ethics","question":"Legal requirements designed to protect the public by providing guidelines for structural, electrical, plumbing, and mechanical areas of a structure.","options":{"A":"Structural Tests","B":"Design Practices","C":"Common Practices","D":"Building Codes"},"correct":"D","explanation":"Building codes are the legal requirements that protect the public by setting minimum standards for structural, electrical, plumbing, and mechanical work."},{"id":216,"theme":"Professionalism and Ethics","question":"Legal possessors of land.","options":{"A":"Builder","B":"Property Owner","C":"Regulator","D":"Real Estate Agent"},"correct":"B","explanation":"A property owner is the legal possessor of land."},{"id":217,"theme":"Professionalism and Ethics","question":"A person trained in the design and construction of public works projects, such as highways, bridges, sanitation facilities, and water treatment plants.","options":{"A":"Regulator","B":"Architect","C":"Civil Engineer","D":"Designer"},"correct":"C","explanation":"A civil engineer is trained in the design and construction of public works projects such as highways, bridges, sanitation facilities, and water treatment plants."},{"id":218,"theme":"Project Delivery and Contract Administration","question":"Specification writing begins at:","options":{"A":"Brief taking stage","B":"Schematic design stage","C":"Concept design stage","D":"Detailed design stage"},"correct":"B","explanation":"Per the source, specification writing begins at the schematic design stage, once the general design direction has been established."},{"id":219,"theme":"Structures and Building Technology","question":"The process of removing concrete forms from the cured concrete?","options":{"A":"Clearing","B":"Deforming works","C":"Stripping","D":"Cleaning"},"correct":"C","explanation":"Stripping is the process of removing formwork from concrete once it has cured."},{"id":220,"theme":"Structures and Building Technology","question":"A watertight structure or chamber within which work is carried on in building.","options":{"A":"Well Foundation","B":"Pile Foundation","C":"Caisson's Foundation","D":"Bench Foundation"},"correct":"C","explanation":"A caisson is a watertight structure or chamber sunk into the ground within which foundation work is carried out."},{"id":221,"theme":"Structures and Building Technology","question":"Large footing extending a wide area.","options":{"A":"Mat/Raft Foundation","B":"Grillage Foundation","C":"Shallow Foundation","D":"Combined Foundation"},"correct":"A","explanation":"A mat/raft foundation is a large, continuous footing that extends under the entire structure, spreading loads over a wide area."},{"id":222,"theme":"Structures and Building Technology","question":"In a building frame, a structural element that is shorter than usual, as a stud above a door opening or below a window sill, is","options":{"A":"Wood Stud","B":"Stirrup","C":"Scarf joint","D":"Cripple stud"},"correct":"D","explanation":"A cripple stud is a shortened stud used above a door opening or below a window sill in a building frame."},{"id":223,"theme":"History and Theory of Architecture","question":"He was called \"Master's master\" where his students are architects like Gropius, Breuer and Van de Rohe.","options":{"A":"Peter Behrens","B":"Eric Mendelsohn","C":"Vitruvius","D":"Frank Lloyd Wright"},"correct":"A","explanation":"Peter Behrens was known as the 'master's master' for mentoring architects such as Walter Gropius, Marcel Breuer, and Ludwig Mies van der Rohe in his studio."},{"id":224,"theme":"History and Theory of Architecture","question":"The Japanese pyramid roof is called","options":{"A":"Kirizuma","B":"Hogyo","C":"Myojin","D":"Shichu"},"correct":"B","explanation":"Hogyo is the traditional Japanese term for a pyramidal (hipped) roof form."},{"id":225,"theme":"History and Theory of Architecture","question":"'I am not attracted to straight angles or to the straight line, hard and inflexible, created by man. I am attracted to free-flowing, sensual curves. The curves that I find in the mountains of my country, in the sinuousness of its rivers, in the waves of the ocean, and on the body of the beloved woman.' Which architect made this statement?","options":{"A":"Alvar Aalto","B":"Frank Gehry","C":"Oscar Niemeyer","D":"Ludwig Mies Van der Rohe"},"correct":"C","explanation":"This well-known quotation about free-flowing, sensual curves inspired by nature and the female form belongs to the Brazilian architect Oscar Niemeyer."},{"id":226,"theme":"History and Theory of Architecture","question":"This Architect, Civil Engineer and military Engineer used the human body to explain that nature's design is based on universal laws of proportion.","options":{"A":"Leon Battista","B":"Andrea Palladio","C":"Marcus Vitruvius","D":"Filippo Brunelleschi"},"correct":"C","explanation":"Marcus Vitruvius, the Roman architect, civil, and military engineer, used the proportions of the human body to illustrate that nature's design follows universal laws of proportion."},{"id":227,"theme":"Structures and Building Technology","question":"Concrete must be placed in position and properly compacted within WHAT minutes after adding water, before cement setting will start?","options":{"A":"45 to 60 minutes","B":"30 to 60 minutes","C":"15 to 30 minutes","D":"10 to 20 minutes"},"correct":"B","explanation":"Per the source, concrete must be placed and properly compacted within 30 to 60 minutes after adding water, before the cement begins to set."},{"id":228,"theme":"History and Theory of Architecture","question":"Egyptian architecture is known for burying their dead in","options":{"A":"Mastaba","B":"Pyramid","C":"Ziggurat","D":"Temple"},"correct":"B","explanation":"Egyptian architecture is most closely associated with burying the dead in pyramids, built as monumental tombs for pharaohs."},{"id":229,"theme":"Project Delivery and Contract Administration","question":"Which of the following is NOT part of the contract agreement in a building project?","options":{"A":"The client/employer","B":"The architect","C":"Witnesses","D":"The contractor"},"correct":"C","explanation":"The building contract is an agreement between the client/employer, the architect, and the contractor; witnesses who sign to attest the document are not themselves parties to the contract agreement."},{"id":230,"theme":"Building Services","question":"A mechanical engineer would typically perform HVAC calculations and load calculations and do single-line duct layouts in which phase of basic services?","options":{"A":"Pre-design","B":"Schematic design","C":"Design development","D":"Construction documents"},"correct":"C","explanation":"HVAC load calculations and single-line duct layouts are typically developed by the mechanical engineer during the design development phase, once the architectural design has been refined enough to support engineering calculations."},{"id":231,"theme":"Professionalism and Ethics","question":"Which of the following architectural precedents is known for its monumental scale and use of the arch?","options":{"A":"Ancient Greek Temples","B":"Egyptian Pyramids","C":"Roman Colosseum","D":"Gothic Cathedrals"},"correct":"C","explanation":"The Roman Colosseum is renowned for its massive scale and extensive use of arches in its structural and facade design, a hallmark of Roman engineering."},{"id":232,"theme":"Professionalism and Ethics","question":"The Bauhaus movement, a key influence on Modern Architecture, originated in which country?","options":{"A":"France","B":"Germany","C":"United States","D":"Italy"},"correct":"B","explanation":"The Bauhaus school was founded in Weimar, Germany, in 1919 and became a foundational influence on Modern Architecture worldwide."},{"id":233,"theme":"Professionalism and Ethics","question":"Which characteristic is a defining feature of traditional Nigerian vernacular architecture?","options":{"A":"Extensive use of steel and glass","B":"Adaptation to local climate and materials","C":"Strict adherence to symmetrical forms","D":"Emphasis on ornate decoration"},"correct":"B","explanation":"Traditional Nigerian vernacular architecture is defined by its responsiveness to local climate conditions and its use of locally available, natural materials."},{"id":234,"theme":"Professionalism and Ethics","question":"A prominent figure in early Modern Nigerian Architecture known for his contextual designs is:","options":{"A":"Le Corbusier","B":"Louis Sullivan","C":"Demas Nwoko","D":"Zaha Hadid"},"correct":"C","explanation":"Demas Nwoko is celebrated as a pioneer of early Modern Nigerian architecture whose designs responded to local context, climate, and culture rather than imported foreign forms."},{"id":235,"theme":"Professionalism and Ethics","question":"The concept of \"form follows function\" is a central tenet of which architectural movement?","options":{"A":"Art Deco","B":"Gothic","C":"Modernism","D":"Baroque"},"correct":"C","explanation":"\"Form follows function\" is the guiding principle of Modernist architecture, which prioritizes a building's purpose in shaping its design over decorative tradition."},{"id":236,"theme":"Professionalism and Ethics","question":"Which ancient architectural wonder utilized sophisticated engineering for water management?","options":{"A":"Parthenon","B":"Great Wall of China","C":"Roman Aqueducts","D":"Stonehenge"},"correct":"C","explanation":"Roman aqueducts used sophisticated gravity-fed engineering to transport water over long distances to supply cities, reservoirs, and public baths."},{"id":237,"theme":"Professionalism and Ethics","question":"Sustainability and environmental consciousness are key trends in contemporary:","options":{"A":"Classical Architecture","B":"Postmodern Architecture","C":"Modern Architecture","D":"All of the above"},"correct":"C","explanation":"Sustainability and environmental consciousness have become defining trends within contemporary Modern Architecture as designers respond to climate and resource concerns."},{"id":238,"theme":"Professionalism and Ethics","question":"Stilt houses are a common feature in the vernacular architecture of which type of environment?","options":{"A":"Desert regions","B":"Mountainous terrains","C":"Coastal and flood-prone areas","D":"Grasslands"},"correct":"C","explanation":"Stilt houses raise living spaces above ground level to protect against flooding, making them a common vernacular solution in coastal and flood-prone areas."},{"id":239,"theme":"Professionalism and Ethics","question":"Which Nigerian architect is known for his advocacy of \"Africanness\" in architectural design?","options":{"A":"Herbert Macaulay","B":"Babatunde Aguda","C":"Demas Nwoko","D":"Nnamdi Azikiwe"},"correct":"C","explanation":"Demas Nwoko is renowned for advocating an authentically African architectural identity, blending indigenous forms and materials with modern design."},{"id":240,"theme":"Professionalism and Ethics","question":"Deconstructivism is a late 20th-century architectural movement characterized by:","options":{"A":"A return to classical ornamentation","B":"Fragmentation and non-rectilinear forms","C":"Strict adherence to functional principles","D":"Emphasis on historical context"},"correct":"B","explanation":"Deconstructivism, emerging in the late 20th century, is characterized by fragmented, distorted, and non-rectilinear forms that challenge conventional architectural structure."},{"id":241,"theme":"Professionalism and Ethics","question":"The primary legislation regulating architectural practice in Nigeria is the:","options":{"A":"National Building Code","B":"Town and Country Planning Act","C":"Architects Registration Council of Nigeria (ARCON) Act","D":"Companies and Allied Matters Act"},"correct":"C","explanation":"The Architects Registration Council of Nigeria (ARCON) Act is the principal law governing the regulation of architectural practice in Nigeria."},{"id":242,"theme":"Professionalism and Ethics","question":"According to the ARCON Act, who is legally entitled to use the title \"Architect\" in Nigeria?","options":{"A":"Any graduate of an architecture program","B":"Any individual involved in building design","C":"Persons duly registered by ARCON","D":"Foreign architects working on temporary projects"},"correct":"C","explanation":"Under the ARCON Act, only individuals who are duly registered with the Architects Registration Council of Nigeria may legally use the title \"Architect.\""},{"id":243,"theme":"Professionalism and Ethics","question":"The mandatory period of tutelage under the supervision of a registered architect before full registration by ARCON is:","options":{"A":"6 months","B":"1 year","C":"2 years","D":"3 years"},"correct":"C","explanation":"The ARCON Act requires a mandatory two-year period of supervised practical training (tutelage) under a registered architect before an applicant can be fully registered."},{"id":244,"theme":"Professionalism and Ethics","question":"One of the key functions of ARCON is to:","options":{"A":"Promote the interests of building contractors","B":"Set standards for architectural education and practice","C":"Approve all building plans nationwide","D":"Manage government housing projects"},"correct":"B","explanation":"ARCON's core mandate includes setting and maintaining standards for architectural education and professional practice in Nigeria."},{"id":245,"theme":"Professionalism and Ethics","question":"Engaging in architectural practice in Nigeria without being registered by ARCON is considered:","options":{"A":"Ethical but unprofessional","B":"A minor administrative offense","C":"Illegal and subject to penalties","D":"Acceptable for small-scale projects"},"correct":"C","explanation":"Practicing architecture in Nigeria without ARCON registration is an offense under the ARCON Act and can attract legal penalties."},{"id":246,"theme":"Professionalism and Ethics","question":"Architectural design competitions should ideally be judged based on:","options":{"A":"The reputation of the participating architects","B":"The lowest proposed fee","C":"The merit and quality of the design proposal","D":"The personal connections of the architects"},"correct":"C","explanation":"Professional codes of conduct require design competitions to be judged fairly, based on the quality and merit of the submitted design rather than reputation or personal connections."},{"id":247,"theme":"Professionalism and Ethics","question":"An architect soliciting for jobs should primarily focus on:","options":{"A":"Offering the lowest possible fees","B":"Highlighting their qualifications, experience, and design portfolio","C":"Criticizing the work of other architects","D":"Promising unrealistic project timelines"},"correct":"B","explanation":"Ethical marketing for architects focuses on demonstrating genuine qualifications, experience, and design competence rather than undercutting fees or disparaging others."},{"id":248,"theme":"Professionalism and Ethics","question":"Personal integrity in architectural practice demands:","options":{"A":"Always agreeing with the client's preferences","B":"Being truthful, honest, and fair in all professional dealings","C":"Prioritizing personal gain over client interests","D":"Avoiding any form of collaboration with other professionals"},"correct":"B","explanation":"Professional codes of ethics require architects to act with honesty, truthfulness, and fairness in all their professional dealings."},{"id":249,"theme":"Professionalism and Ethics","question":"Maintaining professional competence requires architects to:","options":{"A":"Rely solely on their initial training","B":"Continuously update their knowledge and skills","C":"Avoid complex or innovative projects","D":"Only work within their comfort zone"},"correct":"B","explanation":"Professional competence is maintained through continuous learning and staying current with evolving codes, technologies, and practices."},{"id":250,"theme":"Professionalism and Ethics","question":"An architect's general obligations to the public include:","options":{"A":"Designing solely for the benefit of their clients","B":"Prioritizing aesthetics over safety","C":"Considering the environmental and social impact of their designs","D":"Avoiding any form of public engagement"},"correct":"C","explanation":"Architects have an ethical duty to consider the broader environmental and social impact of their designs on the public, not just client interests."},{"id":251,"theme":"Professionalism and Ethics","question":"When advertising their services, architects should ensure that the information is:","options":{"A":"Exaggerated to attract more clients","B":"Primarily focused on their personal achievements","C":"Truthful, dignified, and not misleading","D":"Directly critical of competitors"},"correct":"C","explanation":"Codes of professional conduct require that advertising be truthful, dignified, and free of misleading claims to protect public trust in the profession."},{"id":252,"theme":"Professionalism and Ethics","question":"Accepting undisclosed commissions or benefits from contractors is a breach of:","options":{"A":"Standard business practice","B":"Ethical conduct and professional integrity","C":"A common marketing strategy","D":"An efficient way to reduce project costs"},"correct":"B","explanation":"Accepting undisclosed commissions from contractors constitutes a conflict of interest and a serious breach of professional ethics and integrity."},{"id":253,"theme":"Professionalism and Ethics","question":"In a design competition, if an architect has prior privileged information related to the project, they should:","options":{"A":"Use it to their advantage","B":"Disclose the information to the competition organizers","C":"Withdraw from the competition to avoid potential bias","D":"Share the information with other participants"},"correct":"C","explanation":"To avoid an unfair advantage and preserve the integrity of the competition, an architect with privileged prior information should withdraw rather than use it."},{"id":254,"theme":"Professionalism and Ethics","question":"An architect has a professional responsibility to inform their client if they have a conflict of interest that may affect their services. This relates to:","options":{"A":"Project scheduling","B":"Financial management","C":"Personal integrity and transparency","D":"Design aesthetics"},"correct":"C","explanation":"Disclosing conflicts of interest is a matter of maintaining personal integrity and transparency in professional relationships with clients."},{"id":255,"theme":"Professionalism and Ethics","question":"Continuous Professional Development (CPD) is essential for architects to:","options":{"A":"Increase their fees","B":"Maintain their registration and professional competence","C":"Avoid communication with clients","D":"Focus solely on past projects"},"correct":"B","explanation":"Continuous Professional Development (CPD) ensures architects remain competent and is often a requirement for maintaining active professional registration."},{"id":256,"theme":"Professionalism and Ethics","question":"The fundamental principle guiding the ethics of the architectural profession is the:","options":{"A":"Pursuit of profit maximization","B":"Obligation to serve and protect the public interest","C":"Adherence to personal artistic preferences","D":"Minimization of project costs at all times"},"correct":"B","explanation":"The architectural profession's ethics are fundamentally grounded in the duty to serve and safeguard the public interest, beyond client or personal interests."},{"id":257,"theme":"Professionalism and Ethics","question":"Socially responsible design considers the needs of:","options":{"A":"Only the immediate client","B":"The broader community and future generations","C":"Only those who can afford premium architectural services","D":"Primarily the aesthetic preferences of the architect"},"correct":"B","explanation":"Socially responsible design takes into account the needs of the wider community and future generations, not just the immediate client."},{"id":258,"theme":"Professionalism and Ethics","question":"In disaster response and recovery, architects can contribute by:","options":{"A":"Focusing solely on rebuilding high-end structures","B":"Designing temporary shelters and planning for long-term reconstruction","C":"Leaving the planning to engineers and construction workers","D":"Prioritizing their existing clients' needs"},"correct":"B","explanation":"Architects can contribute meaningfully to disaster response by designing emergency shelters and planning for sustainable long-term rebuilding."},{"id":259,"theme":"Professionalism and Ethics","question":"Public service and community involvement for architects might include:","options":{"A":"Only accepting paid commissions","B":"Offering pro bono design services for community projects","C":"Avoiding any interaction with the local community","D":"Focusing solely on private sector developments"},"correct":"B","explanation":"Offering pro bono design services for community projects is a direct expression of an architect's public service and community involvement."},{"id":260,"theme":"Professionalism and Ethics","question":"Designing buildings that are accessible to people of all abilities is an example of:","options":{"A":"Trendy design","B":"Socially responsible design","C":"Cost-effective design","D":"Minimalist design"},"correct":"B","explanation":"Designing for accessibility to people of all abilities reflects inclusivity, a core tenet of socially responsible design."},{"id":261,"theme":"Professionalism and Ethics","question":"An architect who volunteers their expertise to help design emergency shelters after a natural disaster is demonstrating:","options":{"A":"Professional opportunism","B":"A lack of focus on their core business","C":"Social responsibility and community involvement","D":"An attempt to gain publicity"},"correct":"C","explanation":"Volunteering professional expertise for disaster relief demonstrates an architect's commitment to social responsibility and community service."},{"id":262,"theme":"Professionalism and Ethics","question":"Considering the environmental impact of material choices and energy efficiency in design is part of:","options":{"A":"Traditional design practices","B":"Socially irresponsible design","C":"Socially responsible design","D":"Exclusively high-budget design"},"correct":"C","explanation":"Considering environmental impacts such as material choice and energy efficiency is a hallmark of socially responsible design practice."},{"id":263,"theme":"Professionalism and Ethics","question":"The ethical obligation to consider the long-term well-being of building occupants relates to:","options":{"A":"Only the initial construction cost","B":"Socially responsible design and public safety","C":"The architect's personal liability insurance","D":"The client's immediate aesthetic preferences"},"correct":"B","explanation":"Ensuring the long-term well-being of building occupants ties directly to an architect's ethical obligations around socially responsible design and public safety."},{"id":264,"theme":"Professionalism and Ethics","question":"Providing design expertise for the development of community centers or public spaces is an example of:","options":{"A":"Unnecessary pro bono work","B":"Public service and community involvement","C":"A standard marketing technique","D":"Interfering with government projects"},"correct":"B","explanation":"Providing design expertise for public or community spaces exemplifies an architect's public service and involvement with the community."},{"id":265,"theme":"Professionalism and Ethics","question":"Designing with consideration for cultural heritage and local context aligns with the principles of:","options":{"A":"Globalized architectural trends","B":"Socially irresponsible design","C":"Socially responsible design","D":"Ignoring client preferences"},"correct":"C","explanation":"Designing with sensitivity to cultural heritage and local context reflects the principles of socially responsible design."},{"id":266,"theme":"Professionalism and Ethics","question":"A common cause of building failure related to design is:","options":{"A":"Use of substandard construction materials","B":"Poor workmanship during construction","C":"Inadequate structural analysis","D":"Lack of regular maintenance"},"correct":"C","explanation":"Inadequate structural analysis during the design phase is a common root cause of building failures, as it can leave weaknesses undetected."},{"id":267,"theme":"Professionalism and Ethics","question":"The effect of a significant building failure on an architect's professional status can include:","options":{"A":"Increased demand for their services due to notoriety","B":"Damage to reputation and potential legal liabilities","C":"Automatic promotion within their firm","D":"Public praise for their innovative design"},"correct":"B","explanation":"A significant building failure can severely damage an architect's professional reputation and expose them to legal liability claims."},{"id":268,"theme":"Professionalism and Ethics","question":"Implementing safety measures during the building design process primarily aims to:","options":{"A":"Reduce construction costs","B":"Ensure aesthetic appeal","C":"Minimize risks to workers and future occupants","D":"Expedite the construction schedule"},"correct":"C","explanation":"Safety measures are incorporated into building design primarily to protect the safety of construction workers and future building occupants."},{"id":269,"theme":"Professionalism and Ethics","question":"A significant risk element in construction is:","options":{"A":"The architect's design fee","B":"Fluctuations in material costs and availability","C":"The client's choice of interior finishes","D":"The color scheme of the building"},"correct":"B","explanation":"Fluctuations in material costs and availability represent a significant risk to construction project budgets and schedules."},{"id":270,"theme":"Professionalism and Ethics","question":"Incorporating Crime Prevention Through Environmental Design (CPTED) principles addresses:","options":{"A":"Energy efficiency","B":"Structural stability","C":"Security considerations in design","D":"Acoustic performance"},"correct":"C","explanation":"Crime Prevention Through Environmental Design (CPTED) is a design approach that uses the built environment to enhance security and reduce criminal opportunity."},{"id":271,"theme":"Professionalism and Ethics","question":"Foundation settlement leading to cracks in walls is an example of:","options":{"A":"A successful design outcome","B":"A type of building maintenance","C":"A cause of building failure","D":"An aesthetic feature"},"correct":"C","explanation":"Foundation settlement causing wall cracks is a recognized structural symptom and cause of building failure."},{"id":272,"theme":"Professionalism and Ethics","question":"An architect's failure to specify fire-resistant materials in a high-rise building could lead to:","options":{"A":"Enhanced natural lighting","B":"Improved acoustic insulation","C":"Significant safety risks and potential professional liability","D":"Reduced construction time"},"correct":"C","explanation":"Omitting fire-resistant materials in a high-rise design creates serious safety hazards and can expose the architect to professional liability."},{"id":273,"theme":"Professionalism and Ethics","question":"Providing adequate ventilation and natural light in building design contributes to:","options":{"A":"Increased energy consumption","B":"Poor indoor air quality","C":"Health, safety, and environmental well-being","D":"Higher construction costs"},"correct":"C","explanation":"Proper ventilation and natural lighting directly support the health, safety, and environmental well-being of building occupants."},{"id":274,"theme":"Professionalism and Ethics","question":"Unstable soil conditions on a construction site represent a:","options":{"A":"Minor inconvenience","B":"Risk element in construction","C":"Benefit to the project schedule","D":"Factor that reduces material costs"},"correct":"B","explanation":"Unstable soil conditions pose structural risks during construction and must be addressed through proper geotechnical assessment."},{"id":275,"theme":"Professionalism and Ethics","question":"Designing emergency exits that are clearly marked and easily accessible is a key aspect of:","options":{"A":"Interior decoration","B":"Aesthetic design","C":"Health and safety in design","D":"Cost optimization"},"correct":"C","explanation":"Clearly marked, accessible emergency exits are a fundamental component of health and safety in building design."},{"id":276,"theme":"Professionalism and Ethics","question":"A negative impact of an architectural scheme on communities in close proximity could be:","options":{"A":"Increased employment opportunities","B":"Improved infrastructure","C":"Displacement of residents or loss of cultural heritage","D":"Enhanced local business activity"},"correct":"C","explanation":"Architectural schemes can negatively affect nearby communities through the displacement of residents or the loss of cultural heritage sites."},{"id":277,"theme":"Professionalism and Ethics","question":"The impact of architectural schemes on communities at large can include:","options":{"A":"Only affecting the immediate neighborhood","B":"Influencing regional development patterns and economic growth","C":"Having no effect beyond the project site","D":"Solely benefiting the client"},"correct":"B","explanation":"Architectural schemes can shape broader regional development patterns and economic growth well beyond their immediate site."},{"id":278,"theme":"Professionalism and Ethics","question":"Architectural schemes can impact the natural environment through:","options":{"A":"Conservation of existing ecosystems","B":"Reduced carbon emissions during construction","C":"Land use changes, pollution, and resource depletion","D":"Enhancement of biodiversity"},"correct":"C","explanation":"Architectural schemes can adversely affect the natural environment through land use changes, pollution, and depletion of natural resources."},{"id":279,"theme":"Professionalism and Ethics","question":"Building for posterity implies designing structures that are:","options":{"A":"Intended for immediate use and short lifespans","B":"Designed to last for many generations and have enduring value","C":"Always the most cost-effective approach","D":"Immune to any form of change or adaptation"},"correct":"B","explanation":"\"Building for posterity\" means designing structures intended to endure across generations and retain lasting value."},{"id":280,"theme":"Professionalism and Ethics","question":"Public consultation in design decision-making aims to:","options":{"A":"Impose the architect's vision on the community","B":"Primarily speed up the design process","C":"Gather community input and address potential concerns","D":"Only inform the public after decisions have been made"},"correct":"C","explanation":"Public consultation in design decision-making is intended to gather input from the community and proactively address their concerns."},{"id":281,"theme":"Pre-Design Planning and Practice Management","question":"Which of the following is the primary regulatory body for architectural practice in Nigeria?","options":{"A":"Nigerian Society of Engineers (NSE)","B":"Council of Registered Builders of Nigeria (CORBON)","C":"Architects Registration Council of Nigeria (ARCON)","D":"Nigerian Institute of Quantity Surveyors (NIQS)"},"correct":"C","explanation":"ARCON is the statutory body established by law to regulate the practice of architecture in Nigeria, including registration of architects and firms."},{"id":282,"theme":"Pre-Design Planning and Practice Management","question":"A sole proprietorship in architectural practice means:","options":{"A":"Two or more architects share ownership and liability","B":"The business is a separate legal entity from the owner","C":"One architect owns and operates the business, bearing all liability","D":"Architects partner with engineers and other professionals"},"correct":"C","explanation":"A sole proprietorship is owned and run by a single individual who bears full personal liability for the firm's obligations, unlike a partnership or company."},{"id":283,"theme":"Pre-Design Planning and Practice Management","question":"Which ownership structure offers limited liability to its owners?","options":{"A":"Partnership","B":"Sole Proprietorship","C":"Limited Liability Company (LLC)","D":"All of the above"},"correct":"C","explanation":"An LLC is a distinct legal entity that shields its owners' personal assets, limiting their liability to their investment in the company, unlike sole proprietorships and general partnerships."},{"id":284,"theme":"Pre-Design Planning and Practice Management","question":"Efficient office administration in an architectural firm includes:","options":{"A":"Ignoring client communication to focus on design","B":"Poor record-keeping to save time","C":"Organized filing systems and clear communication protocols","D":"Discouraging team meetings to avoid distractions"},"correct":"C","explanation":"Well-organized filing and clear communication protocols keep projects on track and information retrievable, which is the hallmark of efficient office administration."},{"id":285,"theme":"Pre-Design Planning and Practice Management","question":"A key element of marketing architectural services is:","options":{"A":"Relying solely on word-of-mouth referrals","B":"Creating a strong portfolio showcasing expertise","C":"Avoiding networking to maintain focus","D":"Offering the lowest fees to attract clients"},"correct":"B","explanation":"A strong portfolio demonstrates a firm's expertise and past work quality, making it one of the most effective marketing tools for winning new clients."},{"id":286,"theme":"Pre-Design Planning and Practice Management","question":"Financial management in an architectural practice involves:","options":{"A":"Ignoring invoices until clients complain","B":"Tracking income and expenses to ensure profitability","C":"Avoiding budgeting to allow for flexibility","D":"Paying all bills late to manage cash flow"},"correct":"B","explanation":"Sound financial management requires systematically tracking income and expenses so the practice remains profitable and solvent."},{"id":287,"theme":"Pre-Design Planning and Practice Management","question":"Continuous Professional Development (CPD) for architects is important for:","options":{"A":"Stagnating knowledge and skills","B":"Remaining updated on new technologies and regulations","C":"Avoiding new ideas and perspectives","D":"Reducing professional competence over time"},"correct":"B","explanation":"CPD ensures architects keep pace with evolving technologies, codes, and best practices, maintaining professional competence throughout their careers."},{"id":288,"theme":"Pre-Design Planning and Practice Management","question":"A residential building designed for a single family is an example of which building typology?","options":{"A":"Commercial","B":"Institutional","C":"Residential","D":"Industrial"},"correct":"C","explanation":"A building intended as a dwelling for a single family falls under the residential typology by definition."},{"id":289,"theme":"Pre-Design Planning and Practice Management","question":"In a building project, the architect's leadership role includes:","options":{"A":"Dictating the structural engineer's calculations","B":"Ignoring the client's preferences","C":"Coordinating the input of all allied professionals","D":"Micromanaging the quantity surveyor's work"},"correct":"C","explanation":"As lead consultant, the architect's role is to coordinate and integrate the contributions of engineers, quantity surveyors, and other allied professionals into a coherent design."},{"id":290,"theme":"Pre-Design Planning and Practice Management","question":"ARCON's Conditions of Engagement outline:","options":{"A":"The contractor's responsibilities on site","B":"The fees and services provided by the professional architect","C":"The client's obligations to other consultants","D":"The local building regulations"},"correct":"B","explanation":"The Conditions of Engagement is the professional document that defines the scope of services an architect provides and the fee scale for those services."},{"id":291,"theme":"Pre-Design Planning and Practice Management","question":"Building Acts in Nigeria primarily regulate:","options":{"A":"Land use zoning","B":"The structural integrity and safety of buildings","C":"The aesthetic design of buildings","D":"The environmental impact of construction"},"correct":"B","explanation":"Building Acts set out the technical and legal standards buildings must meet to ensure they are structurally sound and safe for occupants."},{"id":292,"theme":"Pre-Design Planning and Practice Management","question":"Town Planning Acts and Procedures govern:","options":{"A":"The internal layout of buildings","B":"The overall development and use of land in an area","C":"The selection of building materials","D":"The contractual agreements between clients and architects"},"correct":"B","explanation":"Town planning legislation controls how land within a jurisdiction is developed and used, such as zoning and land allocation, rather than a building's interior."},{"id":293,"theme":"Pre-Design Planning and Practice Management","question":"Building Bye-laws are:","options":{"A":"National laws passed by the federal government","B":"Local regulations governing building design and construction","C":"International standards for architectural practice","D":"Ethical guidelines for architects"},"correct":"B","explanation":"Bye-laws are made and enforced by local or state authorities to set technical requirements for buildings within their jurisdiction."},{"id":294,"theme":"Pre-Design Planning and Practice Management","question":"The primary object of building bye-laws and regulations in Nigeria is to:","options":{"A":"Increase the cost of construction","B":"Promote uniformity in architectural styles","C":"Ensure public safety, health, and welfare related to buildings","D":"Hinder innovative building designs"},"correct":"C","explanation":"Building bye-laws exist to protect occupants and the public by setting minimum standards for safety, health, and general welfare in construction."},{"id":295,"theme":"Pre-Design Planning and Practice Management","question":"A setback in building regulations refers to:","options":{"A":"The area designated for landscaping","B":"The minimum distance a building must be from property lines","C":"The slope of the roof","D":"The height restriction of the building"},"correct":"B","explanation":"A setback is the required clear distance between a building and the boundary of its plot, ensuring light, air, access, and safety."},{"id":296,"theme":"Pre-Design Planning and Practice Management","question":"Airspace regulations primarily control:","options":{"A":"The materials used for roofing","B":"The volume of conditioned air within a building","C":"The vertical extent of property rights and building heights","D":"The noise levels permitted around a building"},"correct":"C","explanation":"Airspace regulations govern how high a building may rise and the extent of a property owner's rights above the land, not ventilation or noise."},{"id":297,"theme":"Pre-Design Planning and Practice Management","question":"Building lines define:","options":{"A":"The boundaries of a property","B":"The area where construction can legally take place on a plot","C":"The alignment of windows and doors","D":"The height of boundary walls"},"correct":"B","explanation":"Building lines mark the limits within a plot beyond which no structure may be erected, effectively defining the legally buildable area."},{"id":298,"theme":"Pre-Design Planning and Practice Management","question":"The administration of building law in Nigeria is primarily the responsibility of:","options":{"A":"Federal Ministry of Works and Housing","B":"State and Local Government planning authorities","C":"Architects Registration Council of Nigeria (ARCON)","D":"Nigerian Society of Engineers (NSE)"},"correct":"B","explanation":"Building control and enforcement of building laws in Nigeria are carried out mainly at the state and local government level through their planning authorities."},{"id":299,"theme":"Pre-Design Planning and Practice Management","question":"The National Building and Safety Code aims to:","options":{"A":"Promote only traditional building methods","B":"Establish uniform standards for building construction across the nation","C":"Allow each state to have completely different building regulations","D":"Focus solely on the aesthetic aspects of building design"},"correct":"B","explanation":"The National Building Code was created to harmonize construction standards and safety requirements across the country rather than leaving each state entirely independent."},{"id":300,"theme":"Pre-Design Planning and Practice Management","question":"Obtaining a building permit typically involves:","options":{"A":"Starting construction immediately and applying later","B":"Submitting design drawings and specifications for approval","C":"Informing the neighbors about the intended construction","D":"Paying a small fee without any documentation"},"correct":"B","explanation":"A building permit application requires submitting design drawings and specifications to the relevant authority for review and approval before construction begins."},{"id":301,"theme":"Pre-Design Planning and Practice Management","question":"APRN stands for:","options":{"A":"Architects' Professional Registration Number","B":"ARCON Project Registration Number","C":"Approved Planning Regula
